<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Snow Rider 3D - Advanced Audit Mode</title>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserSessionPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
            authDomain: "hyperspace-r.firebaseapp.com",
            databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hyperspace-r",
            storageBucket: "hyperspace-r.firebasestorage.app",
            messagingSenderId: "1050495683444",
            appId: "1:1050495683444:web:846c42d274197b20313a21",
            measurementId: "G-8RC2TB95T7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        let gameInstance = null;
        let currentUser = null;

        // --- DEEP AUDIT LOGGING ---
        function addToLog(action, detail) {
            let logs = JSON.parse(localStorage.getItem('game_logs') || "[]");
            const entry = `[${new Date().toLocaleTimeString()}] ${action} >> ${detail}`;
            logs.push(entry);
            localStorage.setItem('game_logs', JSON.stringify(logs));
        }

        window.exportLogs = function() {
            const logs = JSON.parse(localStorage.getItem('game_logs') || "[]");
            const blob = new Blob([logs.join('\n')], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'log.txt';
            link.click();
        };

        // --- THE "CHEAT ANALYZER" OVERRIDE ---
        window.updateHighScore = function(newVal) {
            if (currentUser === "rileysargent2@gmail.com" && gameInstance) {
                const targetKey = "HighScore"; // Unity's standard save key
                const oldData = localStorage.getItem(targetKey) || "UNDEFINED/NULL";
                
                // 1. Log where and what we are hitting
                addToLog("STORAGE_INSPECT", `Target: LocalStorage['${targetKey}']`);
                addToLog("OVERRIDE_DATA", `Replacing Old Content: "${oldData}" with New Content: "${newVal}"`);

                // 2. Inject into Engine and Storage
                gameInstance.SendMessage('GameManager', 'SetScore', parseInt(newVal));
                localStorage.setItem(targetKey, newVal);
                
                // 3. Confirm Save
                const currentData = localStorage.getItem(targetKey);
                addToLog("SAVE_VERIFIED", `Current Key Value is now: "${currentData}"`);
            }
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === '`' && currentUser === "rileysargent2@gmail.com") window.exportLogs();
        });

        const launchGame = () => {
            setTimeout(() => {
                if (!gameInstance) {
                    gameInstance = UnityLoader.instantiate("gameContainer", "Build/SnowRider3D-gd-1.json", {
                        onProgress: UnityProgress,
                        Module: { onRuntimeInitialized: () => {
                            UnityProgress(gameInstance, "complete");
                            addToLog("ENGINE_LOAD", "Unity WebGL instance attached to DOM");
                        }}
                    });
                }
            }, 400); 
        };

        // --- NON-PERSISTENT AUTH ---
        document.getElementById('login-btn').onclick = () => {
            // Forces session-only memory; login clears when tab closes
            setPersistence(auth, browserSessionPersistence).then(() => {
                return signInWithPopup(auth, provider);
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "rileysargent2@gmail.com") {
                currentUser = user.email;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('game-wrapper').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'block';
                addToLog("AUTH_GRANTED", `Admin session initialized for ${user.email}`);
                launchGame();
            } else if (user) {
                signOut(auth).then(() => location.reload());
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
                document.getElementById('game-wrapper').style.display = 'none';
            }
        });
    </script>

    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #auth-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #admin-panel { display: none; position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.9); border: 1px solid #0f0; padding: 10px; z-index: 2000; }
        #game-wrapper { display: none; width: 100vw; height: 100vh; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; width: 100px; padding: 5px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="auth-overlay">
        <h1>HYPERSPACE-R // AUDIT_MODE</h1>
        <button id="login-btn">START SESSION</button>
    </div>
    <div id="admin-panel">
        <div>ANALYZER_V1</div>
        VAL: <input type="number" id="scoreInput" value="99999"><br>
        <button onclick="updateHighScore(document.getElementById('scoreInput').value)">INJECT_AND_LOG</button>
    </div>
    <div id="game-wrapper">
        <div id="gameContainer" style="width: 100%; height: 100%;"></div>
    </div>
</body>
</html>
