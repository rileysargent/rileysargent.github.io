<!DOCTYPE html>
<html lang="en" style="background:#0a0a0f">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Test — Hyperspace Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24;
            --border: rgba(255, 255, 255, 0.07); --accent: #6c63ff; --accent2: #ff6b9d;
            --text: #f0f0ff; --muted: #6b6b8a; --success: #4ade80; --warn: #f59e0b;
            --error: #f87171; --font: 'Syne', sans-serif; --mono: 'JetBrains Mono', monospace;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: #0a0a0f; font-family: var(--font); color: var(--text); }

        #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: rgba(10, 10, 15, .92); border-bottom: 1px solid var(--border); backdrop-filter: blur(16px); }
        .tb-logo { font-size: 14px; font-weight: 800; } .tb-logo span { color: var(--accent); }
        .tb-sep { width: 1px; height: 20px; background: var(--border); }
        .tb-live { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: rgba(74, 222, 128, .08); border: 1px solid rgba(74, 222, 128, .2); border-radius: 20px; font-size: 11px; font-family: var(--mono); color: var(--success); }
        .tb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: blink 1.4s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
        .tb-spacer { flex: 1; }
        #fps-disp { font-family: var(--mono); font-size: 11px; color: var(--muted); }
        .tb-btn { display: flex; align-items: center; gap: 5px; padding: 6px 13px; border: none; border-radius: 8px; font-family: var(--font); font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s; }
        .tb-stop { background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .3); color: var(--error); }
        .tb-ed { background: rgba(245, 158, 11, .1); border: 1px solid rgba(245, 158, 11, .3); color: var(--warn); }

        #gameCanvas { position: fixed; top: 42px; left: 0; right: 0; bottom: 0; display: block; }
        #xhair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; width: 20px; height: 20px; }
        #xhair::before, #xhair::after { content: ''; position: absolute; background: rgba(255, 255, 255, .8); border-radius: 1px; }
        #xhair::before { width: 16px; height: 2px; top: 9px; left: 2px; }
        #xhair::after { width: 2px; height: 16px; top: 2px; left: 9px; }

        #hud { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px 14px; background: linear-gradient(to top, rgba(0,0,0,.75), transparent); pointer-events: none; display: flex; align-items: flex-end; gap: 16px; }
        .stat-bars { display: flex; flex-direction: column; gap: 6px; min-width: 180px; }
        .bar-row { display: flex; align-items: center; gap: 7px; }
        .bar-icon { font-size: 12px; width: 18px; text-align: center; }
        .bar-bg { flex: 1; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; transition: width .2s; }
        .bar-hp { background: linear-gradient(90deg, #f87171, #fb923c); }
        .bar-sp { background: linear-gradient(90deg, #4ade80, #22c55e); }
        .bar-xp { background: linear-gradient(90deg, #6c63ff, #8b5cf6); }
        .bar-lbl { font-family: var(--mono); font-size: 10px; color: rgba(255, 255, 255, .5); min-width: 30px; text-align: right; }

        .hotbar { flex: 1; display: flex; justify-content: center; gap: 4px; pointer-events: all; }
        .hs { width: 50px; height: 50px; border-radius: 8px; background: rgba(0, 0, 0, .55); border: 2px solid rgba(255, 255, 255, .12); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .hs.active { border-color: var(--accent); box-shadow: 0 0 14px rgba(108, 99, 255, .5); }
        .hs-n { position: absolute; top: 2px; left: 4px; font-family: var(--mono); font-size: 9px; color: rgba(255, 255, 255, .35); }

        #minimap { width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .15); overflow: hidden; background: rgba(0, 0, 0, .65); position: relative; flex-shrink: 0; }
        #mm { width: 100%; height: 100%; }

        #coords { position: fixed; top: 52px; left: 12px; z-index: 100; padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, .55); backdrop-filter: blur(8px); border: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--muted); pointer-events: none; }
        #coords span { color: var(--text); }

        #players { position: fixed; top: 52px; right: 12px; z-index: 100; padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, .55); backdrop-filter: blur(8px); border: 1px solid var(--border); font-family: var(--mono); font-size: 11px; min-width: 130px; pointer-events: none; }
        .pp-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
        .pp-d { width: 7px; height: 7px; border-radius: 50%; }

        #toasts { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 5px; align-items: center; pointer-events: none; }
        .toast { padding: 7px 18px; border-radius: 20px; font-size: 13px; background: rgba(10, 10, 15, .9); border: 1px solid var(--border); backdrop-filter: blur(12px); animation: ti .3s ease forwards; }
        @keyframes ti { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

        #chat { position: fixed; bottom: 80px; left: 12px; z-index: 100; width: 260px; pointer-events: none; }
        #chat-msgs { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; margin-bottom: 5px; scrollbar-width: none; }
        .cm { padding: 4px 10px; border-radius: 6px; font-size: 12px; background: rgba(0, 0, 0, .5); border-left: 2px solid var(--accent); color: #fff; }
        .chat-row { display: flex; gap: 5px; pointer-events: all; }
        #ci { flex: 1; padding: 6px 10px; border-radius: 8px; background: rgba(0, 0, 0, .6); border: 1px solid var(--border); color: #fff; font-family: var(--mono); font-size: 12px; outline: none; }

        #death, #pause, #lockscreen, #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 500; }
        #loading { background: #0a0a0f; z-index: 700; }
        #lockscreen { background: rgba(0,0,0,0.8); z-index: 600; }
        .rb, .cpb, .pb { padding: 12px 32px; border: none; border-radius: 10px; cursor: pointer; font-family: var(--font); font-weight: 700; }
        .cpb { background: var(--success); color: #000; }
    </style>
</head>
<body>

<div id="loading">
    <div style="font-size:22px; font-weight:800">Hyper<span>space</span></div>
    <div id="lm" style="font-family:var(--mono); font-size:12px; color:var(--muted)">initializing...</div>
</div>

<div id="lockscreen" style="display:none">
    <h2>▶ Play Test</h2>
    <p style="color:var(--muted); font-size:13px">Click to capture mouse</p>
    <button class="cpb" id="cpb">Start Session</button>
</div>

<div id="topbar">
    <div class="tb-logo">⬡ Hyper<span>space</span></div>
    <div class="tb-sep"></div>
    <div class="tb-live"><div class="tb-dot"></div>Live Build</div>
    <div class="tb-spacer"></div>
    <span id="fps-disp">-- fps</span>
    <button class="tb-btn tb-stop" onclick="stopPlay()">■ Stop</button>
</div>

<canvas id="gameCanvas"></canvas>
<div id="xhair"></div>

<div id="coords">
    X:<span id="cx">0</span> Y:<span id="cy">0</span> Z:<span id="cz">0</span><br>
    Spd:<span id="cspd">0</span> &nbsp;<span id="cgnd">Air</span>
</div>

<div id="players">
    <div style="font-weight:700; margin-bottom:5px">Online</div>
    <div id="pp-list"></div>
</div>

<div id="chat">
    <div id="chat-msgs"></div>
    <div class="chat-row">
        <input id="ci" placeholder="Press T to chat...">
    </div>
</div>

<div id="hud">
    <div class="stat-bars">
        <div class="bar-row">❤️<div class="bar-bg"><div class="bar-fill bar-hp" id="bhp"></div></div><div class="bar-lbl" id="lhp">100</div></div>
        <div class="bar-row">⚡<div class="bar-bg"><div class="bar-fill bar-sp" id="bsp"></div></div><div class="bar-lbl" id="lsp">100</div></div>
    </div>
    <div class="hotbar" id="hotbar">
        <div class="hs active" data-i="0"><div class="hs-n">1</div>🖐️</div>
        <div class="hs" data-i="1"><div class="hs-n">2</div>🔨</div>
        <div class="hs" data-i="2"><div class="hs-n">3</div>🔫</div>
        <div class="hs" data-i="3"><div class="hs-n">4</div></div>
        <div class="hs" data-i="4"><div class="hs-n">5</div></div>
    </div>
    <div id="minimap"><canvas id="mm" width="96" height="96"></canvas></div>
</div>

<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // Global Stubs
    window.stopPlay = () => window.location.reload();
    window.projectId = new URLSearchParams(window.location.search).get('project') || 'demo';
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, onDisconnect } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    // Firebase Init
    const app = initializeApp({
        databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app"
    });
    const db = getDatabase(app);
    const userId = "user_" + Math.floor(Math.random() * 9999);
    window._uid = userId;

    // --- Scene Setup ---
    const canvas = document.getElementById('gameCanvas');
    const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight - 42);
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);
    const cam = new THREE.PerspectiveCamera(75, window.innerWidth/(window.innerHeight-42), 0.1, 1000);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
    scene.add(light);

    const grid = new THREE.GridHelper(100, 50, 0x6c63ff, 0x222222);
    grid.position.y = -0.01;
    scene.add(grid);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial({color: 0x111118}));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // --- Player Logic ---
    let pl = { x: 0, y: 1, z: 5, yaw: 0, pitch: 0, vx: 0, vy: 0, vz: 0, hp: 100, stamina: 100, slot: 0 };
    const keys = {};
    let locked = false;

    const pMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), new THREE.MeshLambertMaterial({color: 0x6c63ff}));
    scene.add(pMesh);

    document.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        if(e.code === 'KeyT') document.getElementById('ci').focus();
        if(e.code.startsWith('Digit')) setSlot(parseInt(e.code.replace('Digit','')) - 1);
    });
    document.addEventListener('keyup', e => keys[e.code] = false);

    document.getElementById('cpb').addEventListener('click', () => canvas.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
        locked = document.pointerLockElement === canvas;
        document.getElementById('lockscreen').style.display = locked ? 'none' : 'flex';
    });

    document.addEventListener('mousemove', e => {
        if(!locked) return;
        pl.yaw -= e.movementX * 0.002;
        pl.pitch = Math.max(-1.5, Math.min(1.5, pl.pitch - e.movementY * 0.002));
    });

    function setSlot(i) {
        if(i < 0 || i > 4) return;
        pl.slot = i;
        document.querySelectorAll('.hs').forEach((el, idx) => el.classList.toggle('active', idx === i));
        toast("Switched to Slot " + (i+1));
    }

    function toast(msg) {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.getElementById('toasts').appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    // --- Chat Logic ---
    const chatInput = document.getElementById('ci');
    chatInput.addEventListener('keydown', e => {
        if(e.key === 'Enter' && chatInput.value.trim()) {
            push(ref(db, 'chats'), { user: userId, msg: chatInput.value, time: Date.now() });
            chatInput.value = '';
            chatInput.blur();
        }
    });

    onValue(ref(db, 'chats'), snap => {
        const msgs = document.getElementById('chat-msgs');
        msgs.innerHTML = '';
        const data = snap.val();
        if(!data) return;
        Object.values(data).slice(-5).forEach(m => {
            const div = document.createElement('div');
            div.className = 'cm';
            div.textContent = `${m.user.split('_')[1]}: ${m.msg}`;
            msgs.appendChild(div);
        });
    });

    // --- Multiplayer ---
    const remotePlayers = {};
    const presRef = ref(db, `players/${userId}`);
    onDisconnect(presRef).remove();

    onValue(ref(db, 'players'), snap => {
        const data = snap.val() || {};
        const list = document.getElementById('pp-list');
        list.innerHTML = '';
        
        // Cleanup old meshes
        Object.keys(remotePlayers).forEach(id => {
            if(!data[id]) {
                scene.remove(remotePlayers[id]);
                delete remotePlayers[id];
            }
        });

        Object.entries(data).forEach(([id, p]) => {
            if(id === userId) return;
            if(!remotePlayers[id]) {
                remotePlayers[id] = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), new THREE.MeshLambertMaterial({color: 0xff6b9d}));
                scene.add(remotePlayers[id]);
            }
            remotePlayers[id].position.set(p.x, p.y, p.z);
            const row = document.createElement('div');
            row.className = 'pp-row';
            row.innerHTML = `<div class="pp-d" style="background:#ff6b9d"></div> ${id}`;
            list.appendChild(row);
        });
    });

    // --- Game Loop ---
    function loop() {
        requestAnimationFrame(loop);

        if(locked) {
            const speed = keys['ShiftLeft'] ? 0.15 : 0.08;
            if(keys['KeyW']) { pl.x -= Math.sin(pl.yaw) * speed; pl.z -= Math.cos(pl.yaw) * speed; }
            if(keys['KeyS']) { pl.x += Math.sin(pl.yaw) * speed; pl.z += Math.cos(pl.yaw) * speed; }
            if(keys['KeyA']) { pl.x -= Math.cos(pl.yaw) * speed; pl.z += Math.sin(pl.yaw) * speed; }
            if(keys['KeyD']) { pl.x += Math.cos(pl.yaw) * speed; pl.z -= Math.sin(pl.yaw) * speed; }
        }

        pMesh.position.set(pl.x, 0.9, pl.z);
        pMesh.rotation.y = pl.yaw;

        cam.position.set(pl.x + Math.sin(pl.yaw)*4, 2.5, pl.z + Math.cos(pl.yaw)*4);
        cam.lookAt(pl.x, 1.5, pl.z);

        document.getElementById('cx').textContent = pl.x.toFixed(1);
        document.getElementById('cz').textContent = pl.z.toFixed(1);

        set(presRef, { x: pl.x, y: 0.9, z: pl.z });
        renderer.render(scene, cam);
    }

    document.getElementById('loading').style.display = 'none';
    loop();
</script>
</body>
</html>
