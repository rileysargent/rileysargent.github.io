<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Snow Rider 3D - Hyperspace-R Secure</title>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserSessionPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
            authDomain: "hyperspace-r.firebaseapp.com",
            databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hyperspace-r",
            storageBucket: "hyperspace-r.firebasestorage.app",
            messagingSenderId: "1050495683444",
            appId: "1:1050495683444:web:846c42d274197b20313a21",
            measurementId: "G-8RC2TB95T7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        let gameInstance = null;
        let currentUser = null;

        // --- Logging & Export ---
        function addToLog(action) {
            let logs = JSON.parse(localStorage.getItem('game_logs') || "[]");
            const entry = `[${new Date().toLocaleString()}] User: ${currentUser || 'Guest'} - Action: ${action}`;
            logs.push(entry);
            localStorage.setItem('game_logs', JSON.stringify(logs));
        }

        window.exportLogs = function() {
            const logs = JSON.parse(localStorage.getItem('game_logs') || "[]");
            const blob = new Blob([logs.join('\n')], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'log.txt';
            link.click();
            addToLog("Logs exported to log.txt");
        };

        // --- Keyboard Shortcut (`) ---
        window.addEventListener('keydown', (e) => {
            if (e.key === '`') {
                if (currentUser === "rileysargent2@gmail.com") {
                    window.exportLogs();
                } else {
                    addToLog("Unauthorized backtick hotkey attempt");
                }
            }
        });

        // --- Game Actions ---
        window.updateHighScore = function(val) {
            if (currentUser === "rileysargent2@gmail.com" && gameInstance) {
                gameInstance.SendMessage('GameManager', 'SetScore', parseInt(val));
                localStorage.setItem('HighScore', val); // Persistent High Score for the browser
                addToLog(`High Score Updated to: ${val}`);
            }
        };

        const launchGame = () => {
            if (!gameInstance) {
                gameInstance = UnityLoader.instantiate("gameContainer", "Build/SnowRider3D-gd-1.json", {
                    onProgress: UnityProgress,
                    Module: { onRuntimeInitialized: () => {
                        UnityProgress(gameInstance, "complete");
                        addToLog("Unity Engine Started");
                    }}
                });
            }
        };

        // --- Auth Logic ---
        document.getElementById('login-btn').onclick = () => {
            setPersistence(auth, browserSessionPersistence).then(() => {
                return signInWithPopup(auth, provider);
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "rileysargent2@gmail.com") {
                currentUser = user.email;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('game-wrapper').style.visibility = 'visible';
                document.getElementById('admin-panel').style.display = 'block';
                addToLog("Session Started: Admin Verified");
                launchGame();
            } else if (user) {
                addToLog(`Blocked Access: ${user.email}`);
                signOut(auth).then(() => { alert("Unauthorized Account"); location.reload(); });
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });
    </script>

    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #auth-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #admin-panel { display: none; position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.9); border: 1px solid #0f0; padding: 10px; z-index: 2000; }
        #game-wrapper { visibility: hidden; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; width: 80px; padding: 5px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: #0a0; }
    </style>
</head>
<body>
    <div id="auth-overlay">
        <h1 style="letter-spacing: 5px;">HYPERSPACE-R // ACCESS</h1>
        <button id="login-btn">AUTHORIZE SESSION</button>
    </div>

    <div id="admin-panel">
        <div>ADMIN_CONSOLE</div>
        <input type="number" id="scoreInput" value="1000">
        <button onclick="updateHighScore(document.getElementById('scoreInput').value)">SET_SCORE</button>
        <div style="font-size: 10px; margin-top: 5px;">PRESS ` TO EXPORT LOGS</div>
    </div>

    <div id="game-wrapper">
        <div id="gameContainer" style="width: 100vw; height: 100vh;"></div>
    </div>
</body>
</html>
