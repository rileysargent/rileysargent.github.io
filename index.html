<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Hyperspace-R // Deep Audit</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #auth-overlay { position: fixed; inset: 0; background: #0a0a0a; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 4px solid #333; }
        #admin-panel { display: none; position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.95); border: 1px solid #0f0; padding: 15px; z-index: 5000; box-shadow: 0 0 20px #0f0; width: 260px; }
        #game-wrapper { display: none; width: 100vw; height: 100vh; }
        button { background: #0f0; color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; font-family: inherit; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px; width: calc(100% - 20px); margin-bottom: 10px; }
        .status-text { font-size: 10px; color: #0a0; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserSessionPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
            authDomain: "hyperspace-r.firebaseapp.com",
            databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hyperspace-r",
            storageBucket: "hyperspace-r.firebasestorage.app",
            messagingSenderId: "1050495683444",
            appId: "1:1050495683444:web:846c42d274197b20313a21",
            measurementId: "G-8RC2TB95T7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        let gameInstance = null;
        let currentUser = null;

        // --- 1. GLOBAL DATA INTERCEPTOR (RAW STORAGE HOOKS) ---
        const originalSet = localStorage.setItem;
        localStorage.setItem = function(key, value) {
            console.log(`%c[STORAGE_WRITE] Key: ${key} | Raw:`, "color: #0f0; font-weight: bold;", value);
            originalSet.apply(this, arguments);
        };

        // --- 2. INDEXED_DB RAW DATA CRAWLER ---
        window.dumpRawIDB = async function() {
            if (currentUser !== "rileysargent2@gmail.com") return;
            console.log("%c[IDB_AUDIT] Initializing Deep Crawl...", "color: #f0f; font-weight: bold;");
            
            const dbs = await window.indexedDB.databases();
            for (const dbInfo of dbs) {
                const req = window.indexedDB.open(dbInfo.name);
                req.onsuccess = (e) => {
                    const db = e.target.result;
                    Array.from(db.objectStoreNames).forEach(storeName => {
                        const transaction = db.transaction(storeName, "readonly");
                        const store = transaction.objectStore(storeName);
                        store.openCursor().onsuccess = (ev) => {
                            const cursor = ev.target.result;
                            if (cursor) {
                                console.log(`%cDB: ${db.name} | Store: ${storeName}`, "color: #0ff; font-weight: bold;");
                                console.log(` %cKey:`, "color: #aaa", cursor.key);
                                console.log(` %cValue:`, "color: #fff", cursor.value);
                                cursor.continue();
                            }
                        };
                    });
                };
            }
        };

        // --- 3. DYNAMIC UNITY BOOT (IDENTITY SECURE) ---
        async function bootEngine() {
            console.log("%c[SECURITY] User Verified. Injecting Unity Pipeline...", "color: #0f0");
            
            const injectScript = (src) => new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                document.head.appendChild(s);
            });

            // Dynamically load game scripts only after login
            await injectScript("TemplateData/UnityProgress.js");
            await injectScript("Build/UnityLoader.js");

            gameInstance = UnityLoader.instantiate("gameContainer", "Build/SnowRider3D-gd-1.json", {
                onProgress: UnityProgress,
                Module: { onRuntimeInitialized: () => console.log("%c[SYSTEM] Engine Runtime Ready.", "color: #0f0") }
            });
        }

        // --- 4. AUTHENTICATION & ACCESS LOCK ---
        onAuthStateChanged(auth, (user) => {
            const overlay = document.getElementById('auth-overlay');
            const wrapper = document.getElementById('game-wrapper');

            if (user && user.email === "rileysargent2@gmail.com") {
                currentUser = user.email;
                overlay.style.display = 'none';
                wrapper.style.display = 'block';
                bootEngine(); 
            } else if (user) {
                signOut(auth).then(() => { alert("UNAUTHORIZED ACCOUNT"); location.reload(); });
            } else {
                overlay.style.display = 'flex';
                wrapper.style.display = 'none';
            }
        });

        // --- 5. HOTKEYS & CHEATS ---
        window.addEventListener('keydown', (e) => {
            if (currentUser !== "rileysargent2@gmail.com") return;
            
            // Toggle Admin Panel with &
            if (e.key === '&') {
                const panel = document.getElementById('admin-panel');
                panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
                window.dumpRawIDB(); // Auto-crawl on open
            }
            
            // Export Audit Logs with `
            if (e.key === '`') {
                const logs = localStorage.getItem('game_logs') || "[]";
                const blob = new Blob([logs], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'audit_log.txt';
                a.click();
            }
        });

        window.injectCheat = () => {
            const score = document.getElementById('cheatScore').value;
            console.log(`%c[MANUAL_INJECTION] Setting HighScore to ${score}`, "color: red; font-weight: bold;");
            gameInstance.SendMessage('GameManager', 'SetScore', parseInt(score));
            localStorage.setItem('HighScore', score);
        };

        document.getElementById('login-btn').onclick = () => {
            setPersistence(auth, browserSessionPersistence).then(() => signInWithPopup(auth, provider));
        };
    </script>
</head>
<body>
    <div id="auth-overlay">
        <div style="font-weight: bold; letter-spacing: 5px;">HYPERSPACE-R // ANALYZER</div>
        <div class="status-text">Encrypted Access Required</div>
        <button id="login-btn" style="width: auto; padding: 10px 40px; margin-top: 20px;">AUTHORIZE</button>
    </div>

    <div id="admin-panel">
        <div style="font-size: 12px; margin-bottom: 10px;"><b>IDB_RAW_DATA_ROOT</b></div>
        <hr border="1" color="#0f0">
        SCORE_OVERRIDE: <input type="number" id="cheatScore" value="99999"><br>
        <button onclick="injectCheat()">INJECT_DATA</button>
        <button onclick="window.dumpRawIDB()">REFRESH_IDB_CRAWL</button>
        <div style="font-size: 9px; color: #0a0; margin-top: 10px;">HOTKEYS: (&) TOGGLE PANEL | (`) AUDIT LOG</div>
    </div>

    <div id="game-wrapper"><div id="gameContainer" style="width: 100%; height: 100%;"></div></div>
</body>
</html>
