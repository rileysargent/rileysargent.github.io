<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C H A T</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #dcd6f7 0%, #a6b1e1 100%);
            --glass-white: rgba(255, 255, 255, 0.45);
            --accent-purple: #7b2cbf;
            --text-main: #2d3436;
            --role-admin: #e74c3c;
            --role-member: #3498db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-gradient); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        #auth-screen { position: fixed; inset: 0; background: var(--bg-gradient); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .auth-card { background: var(--glass-white); backdrop-filter: blur(15px); padding: 40px; border-radius: 24px; width: 380px; text-align: center; border: 1px solid rgba(255,255,255,0.4); }

        #app-window { width: 95vw; height: 90vh; background: var(--glass-white); backdrop-filter: blur(20px); border-radius: 24px; display: flex; overflow: hidden; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 20px 50px rgba(0,0,0,0.1); }

        /* Left Rail (Servers) */
        #server-rail { width: 70px; background: rgba(255, 255, 255, 0.3); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; border-right: 1px solid rgba(255,255,255,0.2); }
        .nav-btn { width: 48px; height: 48px; border-radius: 16px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-purple); transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav-btn:hover, .nav-btn.active { background: var(--accent-purple); color: white; border-radius: 12px; }

        /* Sidebar (Channels/DMs) */
        #sidebar { width: 260px; background: rgba(255, 255, 255, 0.2); border-right: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px 20px; font-weight: 800; color: var(--accent-purple); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .list-area { flex: 1; padding: 15px; overflow-y: auto; }
        .list-item { padding: 12px; border-radius: 12px; cursor: pointer; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .list-item:hover { background: rgba(255,255,255,0.4); }
        .list-item.active { background: white; color: var(--accent-purple); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Main Chat Area */
        #chat-main { flex: 1; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.6); position: relative; }
        #chat-header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        #messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
        
        /* Message Bubbles - DIRECTIONAL */
        .msg-wrapper { display: flex; gap: 10px; max-width: 80%; }
        .msg-wrapper.sent { align-self: flex-end; flex-direction: row-reverse; }
        .msg-wrapper.received { align-self: flex-start; }

        .pfp { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-purple); color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0; border: 2px solid white; object-fit: cover; }
        
        .msg-content { display: flex; flex-direction: column; }
        .sent .msg-content { align-items: flex-end; }

        .msg-bubble { padding: 12px 18px; border-radius: 18px; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .sent .msg-bubble { background: var(--accent-purple); color: white; border-bottom-right-radius: 4px; }
        .received .msg-bubble { background: white; color: var(--text-main); border-bottom-left-radius: 4px; }

        .msg-meta { font-size: 10px; margin-bottom: 4px; opacity: 0.8; }
        .role-tag { font-size: 9px; padding: 2px 6px; border-radius: 10px; color: white; margin-left: 5px; text-transform: uppercase; }

        /* Tools */
        #input-bar { padding: 20px 30px; display: flex; gap: 12px; background: rgba(255,255,255,0.3); }
        input.main-input { flex: 1; padding: 14px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.5); outline: none; }
        .btn-purple { background: var(--accent-purple); color: white; border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: 600; }
        
        #call-overlay { display: none; background: #000; height: 40%; position: relative; border-bottom: 2px solid var(--accent-purple); }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h1 style="color: var(--accent-purple); margin-bottom: 20px;">C H A T</h1>
        <input type="text" id="auth-email" class="main-input" placeholder="email@pacificeducation.online" style="width:100%; margin-bottom:10px;">
        <input type="text" id="auth-nick" class="main-input" placeholder="Nickname" style="width:100%; margin-bottom:20px;">
        <button class="btn-purple" style="width:100%" onclick="login()">Enter</button>
    </div>
</div>

<div id="app-window">
    <nav id="server-rail">
        <div class="nav-btn active" id="dm-nav" onclick="loadDMs()">DM</div>
        <div id="server-list"></div>
        <div class="nav-btn" onclick="createServer()">+</div>
    </nav>

    <aside id="sidebar">
        <div class="sidebar-header" id="sidebar-title">Messages</div>
        <div class="list-area" id="list-container"></div>
    </aside>

    <main id="chat-main">
        <header id="chat-header">
            <h3 id="target-display">Select Chat</h3>
            <div>
                <button class="btn-purple" onclick="startCall('video')">📹</button>
                <button class="btn-purple" onclick="startCall('screen')">🖥️</button>
            </div>
        </header>

        <div id="call-overlay">
            <video id="call-video" autoplay playsinline></video>
            <button class="btn-purple" onclick="endCall()" style="position:absolute; bottom:10px; left:10px;">End</button>
        </div>

        <div id="messages"></div>

        <div id="input-bar">
            <input type="text" id="msg-input" class="main-input" placeholder="Type message or /command...">
            <button class="btn-purple" onclick="sendMsg()">Send</button>
        </div>
    </main>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
        authDomain: "hyperspace-r.firebaseapp.com",
        databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hyperspace-r",
        storageBucket: "hyperspace-r.firebasestorage.app",
        messagingSenderId: "1050495683444",
        appId: "1:1050495683444:web:846c42d274197b20313a21"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let me = { id: '', name: '', role: 'Member', pfp: '' };
    let currentPath = '';
    let currentStream = null;

    async function login() {
        const email = document.getElementById('auth-email').value.toLowerCase();
        const nick = document.getElementById('auth-nick').value.trim();
        if(!nick || !email.includes('pacificeducation.online')) return alert("Use Institutional Email");

        const cred = await auth.signInAnonymously();
        me.id = cred.user.uid;
        me.name = nick;
        
        // Load existing profile if exists
        const snap = await db.ref(`users/${me.id}`).once('value');
        if(snap.exists()) {
            me = {...me, ...snap.val()};
        } else {
            db.ref(`users/${me.id}`).set({ name: me.name, role: 'Member', pfp: '', online: true });
        }

        document.getElementById('auth-screen').style.display = 'none';
        loadDMs();
        loadServers();
    }

    function loadDMs() {
        document.getElementById('sidebar-title').innerText = "Direct Messages";
        db.ref('users').on('value', snap => {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            snap.forEach(u => {
                if(u.key === me.id) return;
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<div class="pfp" style="width:24px; height:24px; font-size:10px">${u.val().name[0]}</div> ${u.val().name}`;
                div.onclick = () => {
                    const pair = me.id < u.key ? `${me.id}_${u.key}` : `${u.key}_${me.id}`;
                    openChat(`dms/${pair}`, u.val().name);
                };
                container.appendChild(div);
            });
        });
    }

    function createServer() {
        const n = prompt("Server Name:");
        if(n) db.ref('servers').push({ name: n, owner: me.id, channels: { 'general': {name: 'general'} } });
    }

    function loadServers() {
        db.ref('servers').on('value', snap => {
            const rail = document.getElementById('server-list');
            rail.innerHTML = '';
            snap.forEach(s => {
                const div = document.createElement('div');
                div.className = 'nav-btn';
                div.innerText = s.val().name[0];
                div.onclick = () => {
                    document.getElementById('sidebar-title').innerText = s.val().name;
                    const container = document.getElementById('list-container');
                    container.innerHTML = '';
                    for(let k in s.val().channels) {
                        const c = document.createElement('div');
                        c.className = 'list-item';
                        c.innerText = '# ' + s.val().channels[k].name;
                        c.onclick = () => openChat(`servers/${s.key}/channels/${k}`, s.val().channels[k].name);
                        container.appendChild(c);
                    }
                };
                rail.appendChild(div);
            });
        });
    }

    function openChat(path, name) {
        currentPath = path;
        document.getElementById('target-display').innerText = name;
        const msgBox = document.getElementById('messages');
        msgBox.innerHTML = '';

        db.ref(`${path}/messages`).off();
        db.ref(`${path}/messages`).on('child_added', snap => {
            const m = snap.val();
            const isMe = m.senderId === me.id;
            
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${isMe ? 'sent' : 'received'}`;
            
            const pfpHtml = m.pfp 
                ? `<img src="${m.pfp}" class="pfp">` 
                : `<div class="pfp">${m.senderName[0]}</div>`;

            const roleColor = m.role === 'Admin' ? 'var(--role-admin)' : 'var(--role-member)';

            wrapper.innerHTML = `
                ${pfpHtml}
                <div class="msg-content">
                    <div class="msg-meta">
                        ${m.senderName} <span class="role-tag" style="background:${roleColor}">${m.role}</span>
                    </div>
                    <div class="msg-bubble">${m.text.replace(/badword|spam/gi, '***')}</div>
                </div>
            `;
            msgBox.appendChild(wrapper);
            msgBox.scrollTop = msgBox.scrollHeight;
        });
    }

    function sendMsg() {
        const input = document.getElementById('msg-input');
        const val = input.value.trim();
        if(!val || !currentPath) return;

        // Command Handler
        if(val.startsWith('/')) {
            const args = val.split(' ');
            if(args[0] === '/role') {
                me.role = args[1] || 'Member';
                db.ref(`users/${me.id}/role`).set(me.role);
            } else if(args[0] === '/pfp') {
                me.pfp = args[1] || '';
                db.ref(`users/${me.id}/pfp`).set(me.pfp);
            }
            input.value = '';
            return;
        }

        db.ref(`${currentPath}/messages`).push({
            senderId: me.id,
            senderName: me.name,
            role: me.role,
            pfp: me.pfp,
            text: val,
            timestamp: Date.now()
        });
        input.value = '';
    }

    async function startCall(type) {
        try {
            currentStream = type === 'video' 
                ? await navigator.mediaDevices.getUserMedia({video: true, audio: true})
                : await navigator.mediaDevices.getDisplayMedia({video: true});
            document.getElementById('call-video').srcObject = currentStream;
            document.getElementById('call-overlay').style.display = 'block';
        } catch(e) {}
    }

    function endCall() {
        if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-overlay').style.display = 'none';
    }

    document.getElementById('msg-input').onkeypress = e => { if(e.key === 'Enter') sendMsg(); };
</script>
</body>
</html>
