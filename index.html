<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dell Optiplex 7010 - Terminal Edition</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #ccc; font-family: "Courier New", monospace; height: 100%; overflow: hidden; }
        #boot-screen { padding: 20px; height: 60vh; display: flex; flex-direction: column; justify-content: space-between; }
        .dell-logo { color: #fff; font-size: 32px; font-weight: bold; border: 2px solid #fff; display: inline-block; padding: 5px 15px; border-radius: 40px; }
        #screen-container { display: none; width: 100vw; height: 65vh; background: #000; border-bottom: 2px solid #333; }
        #terminal { height: 35vh; width: 100%; background: #050505; color: #00ff00; font-size: 11px; overflow-y: auto; padding: 10px; box-sizing: border-box; border-top: 1px solid #222; }
        #bios-ui { position: fixed; top: 150px; left: 20px; background: #111; padding: 15px; border: 1px solid #0056b3; width: 280px; z-index: 100; }
        .btn { background: #0056b3; color: #fff; border: none; padding: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .err { color: #ff5555; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div>
            <div class="dell-logo">DELL</div>
            <p>Optiplex 7010 | BIOS A29</p>
            <p>CPU: Intel i5-3470 @ 3.20GHz</p>
        </div>
        <p>Press F12 for Boot Menu... | <span id="clock"></span></p>
    </div>

    <div id="screen-container"><div id="screen"></div></div>

    <div id="bios-ui">
        <b style="color:#fff">BOOT SEQUENCE</b><br>
        <input type="file" id="iso-input" style="font-size:10px; margin-top:10px;">
        <button class="btn" onclick="powerOn()">EXECUTE BOOT</button>
    </div>

    <div id="terminal">
        <div>[ SYSTEM ] Diagnostic console active...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/copy/v86@master/build/libv86.js"></script>

    <script>
        const term = document.getElementById('terminal');
        function log(msg, isErr = false) {
            const div = document.createElement('div');
            if(isErr) div.className = 'err';
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        // Global Error Catch
        window.addEventListener('error', (e) => log(`RUNTIME ERROR: ${e.message}`, true));
        
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

        function powerOn() {
            const file = document.getElementById('iso-input').files[0];
            if (!file) { log("BOOT ERROR: Drive SATA-1 empty.", true); return; }

            log(`Starting POST for ${file.name}...`);
            
            if (typeof V86Starter !== 'function') {
                log("CRITICAL: libv86.js failed to initialize. Checking CDN...", true);
                // Attempt Emergency Re-load
                const s = document.createElement('script');
                s.src = "https://copy.sh/v86/build/libv86.js";
                s.onload = () => log("Emergency Library Patch Applied. Click 'EXECUTE BOOT' again.");
                document.head.appendChild(s);
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                log("ISO buffered. Initializing hardware layers...");
                
                document.getElementById('bios-ui').style.display = 'none';
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('screen-container').style.display = 'block';

                try {
                    window.emulator = new V86Starter({
                        wasm_path: "https://cdn.jsdelivr.net/gh/copy/v86@master/build/v86.wasm",
                        memory_size: 512 * 1024 * 1024,
                        vga_memory_size: 8 * 1024 * 1024, // Keep low for compatibility
                        screen_container: document.getElementById("screen"),
                        bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
                        vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
                        cdrom: { buffer: e.target.result },
                        autostart: true,
                        // Compatibility flags for GitHub Pages
                        disable_keyboard: false,
                        disable_mouse: false
                    });

                    log("Emulator engine started. Handing off to SeaBIOS...");
                    
                    // Periodically check if emulator is actually running
                    setTimeout(() => {
                        if (window.emulator.is_running()) {
                            log("CPU cycle detected. Boot successful.");
                        } else {
                            log("WARNING: CPU cycle stalled. Possible WASM block.", true);
                        }
                    }, 3000);

                } catch (err) {
                    log(`EMULATOR HALT: ${err.message}`, true);
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
