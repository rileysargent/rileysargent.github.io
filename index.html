<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C H A T | ULTRA</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-deep: #0e1113;
            --bg-side: #1e2327;
            --bg-chat: #2b3137;
            --bg-settings: #363d44;
            --accent: #5865f2;
            --text-main: #ffffff;
            --text-muted: #b5bac1;
            --danger: #ed4245;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'GG Sans', 'Inter', sans-serif; }
        body { background: var(--bg-deep); height: 100vh; display: flex; color: var(--text-main); overflow: hidden; }

        /* 1. DISCORD-STYLE RAIL (image_09723b) */
        #nav-rail { width: 72px; background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; }
        .guild-icon { 
            width: 48px; height: 48px; border-radius: 50%; background: var(--bg-settings); 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative;
        }
        .guild-icon:hover { border-radius: 16px; background: var(--accent); }
        .guild-icon.active::before { content: ""; position: absolute; left: -12px; height: 40px; width: 4px; background: white; border-radius: 0 4px 4px 0; }

        /* 2. SIDEBAR (image_09721c) */
        #sidebar { width: 240px; background: var(--bg-side); display: flex; flex-direction: column; }
        .side-header { 
            height: 48px; padding: 0 16px; display: flex; align-items: center; 
            font-weight: 700; border-bottom: 1px solid rgba(0,0,0,0.2); box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            cursor: pointer; position: relative;
        }
        .side-header:hover { background: rgba(255,255,255,0.05); }

        .scroller { flex: 1; overflow-y: auto; padding: 8px; }
        .nav-item { 
            padding: 8px 12px; border-radius: 4px; cursor: pointer; color: var(--text-muted); 
            display: flex; align-items: center; gap: 10px; margin-bottom: 2px; font-size: 14px;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; }

        /* 3. CHAT WINDOW */
        #chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
        #chat-header { height: 48px; border-bottom: 1px solid rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 16px; gap: 10px; font-weight: 600; }
        #message-scroller { flex: 1; overflow-y: auto; padding: 16px; }

        .msg { display: flex; gap: 16px; margin-bottom: 18px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #444; flex-shrink: 0; background-size: cover; }
        .msg-body { flex: 1; }
        .msg-user { font-weight: 600; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .msg-time { font-size: 11px; font-weight: 400; color: var(--text-muted); }
        .msg-content { font-size: 14.5px; color: #dbdee1; line-height: 1.3; }

        /* 4. SETTINGS OVERLAY (image_096f33 & image_096f54) */
        .settings-overlay {
            position: fixed; inset: 0; background: var(--bg-chat); z-index: 5000;
            display: none; display: flex;
        }
        #settings-sidebar { width: 280px; background: var(--bg-side); display: flex; flex-direction: column; align-items: flex-end; padding: 60px 6px 20px 20px; }
        #settings-content { flex: 1; background: var(--bg-chat); padding: 60px 40px; overflow-y: auto; }
        
        .setting-nav { width: 190px; padding: 6px 10px; border-radius: 4px; cursor: pointer; color: var(--text-muted); font-size: 15px; margin-bottom: 2px; }
        .setting-nav:hover { background: rgba(255,255,255,0.05); }
        .setting-nav.active { background: rgba(255,255,255,0.1); color: white; }
        .setting-header { width: 190px; font-size: 12px; font-weight: 800; color: var(--text-muted); padding: 8px 10px; text-transform: uppercase; }

        .account-card { background: var(--bg-deep); border-radius: 8px; padding: 16px; margin-top: 20px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #333; }
        
        .close-btn { 
            position: absolute; right: 40px; top: 40px; width: 36px; height: 36px; 
            border: 2px solid var(--text-muted); border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; font-weight: 900; color: var(--text-muted);
        }

        /* Toggles */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #4e5058; transition: .4s; border-radius: 34px; }
        input:checked + .slider { background-color: #3ba55c; }

        #login-screen { position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="login-screen">
    <div style="background: var(--bg-chat); padding: 32px; border-radius: 8px; width: 400px; text-align: center;">
        <h2 style="margin-bottom: 24px;">Welcome Back!</h2>
        <input type="text" id="email-in" placeholder="Email" style="width:100%; padding:12px; background:#1e1e1e; border:none; color:white; border-radius:4px; margin-bottom:12px;">
        <input type="text" id="nick-in" placeholder="Username" style="width:100%; padding:12px; background:#1e1e1e; border:none; color:white; border-radius:4px; margin-bottom:24px;">
        <button onclick="app.login()" style="width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Login</button>
    </div>
</div>

<div id="settings-ui" class="settings-overlay" style="display:none">
    <aside id="settings-sidebar">
        <div class="setting-header">User Settings</div>
        <div class="setting-nav active" onclick="app.setPage('account')">My Account</div>
        <div class="setting-nav" onclick="app.setPage('profile')">Profiles</div>
        <div class="setting-nav" onclick="app.setPage('privacy')">Privacy & Safety</div>
        <div class="setting-nav" onclick="app.setPage('appearance')">Appearance</div>
        <div class="setting-nav" onclick="app.setPage('notifications')">Notifications</div>
        <div style="height: 1px; background: #333; margin: 10px 0; width: 190px;"></div>
        <div class="setting-header">Server Settings</div>
        <div class="setting-nav" onclick="app.setPage('server-overview')">Overview</div>
        <div class="setting-nav" onclick="app.setPage('roles')">Roles</div>
        <div class="setting-nav" onclick="app.setPage('moderation')">Moderation</div>
        <div style="height: 1px; background: #333; margin: 10px 0; width: 190px;"></div>
        <div class="setting-nav" style="color: var(--danger)" onclick="app.logout()">Log Out</div>
    </aside>
    <main id="settings-content">
        <div class="close-btn" onclick="document.getElementById('settings-ui').style.display='none'">ESC</div>
        <div id="page-render"></div>
    </main>
</div>

<nav id="nav-rail">
    <div class="guild-icon active" title="Direct Messages">DM</div>
    <div style="width:32px; height:2px; background:#333; margin:4px 0;"></div>
    <div id="server-icons"></div>
    <div class="guild-icon" style="color:#3ba55c" onclick="app.createServer()">+</div>
</nav>

<aside id="sidebar">
    <header class="side-header" id="guild-name">Direct Messages</header>
    <div class="scroller" id="channel-list"></div>
    <div style="padding:10px; background:rgba(0,0,0,0.1); display:flex; align-items:center; gap:8px;">
        <div class="avatar" style="width:32px; height:32px;" id="my-small-avatar"></div>
        <div style="flex:1; font-size:12px;">
            <div style="font-weight:700;" id="my-name-display">...</div>
            <div style="color:var(--text-muted)">#0001</div>
        </div>
        <div style="cursor:pointer" onclick="app.toggleSettings()">⚙️</div>
    </div>
</aside>

<main id="chat-main">
    <header id="chat-header"># general</header>
    <div id="message-scroller"></div>
    <div style="padding:0 16px 24px;">
        <input type="text" id="chat-input" placeholder="Message #general" style="width:100%; padding:11px 16px; background:#383f44; border:none; border-radius:8px; color:white; outline:none;">
    </div>
</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
        authDomain: "hyperspace-r.firebaseapp.com",
        databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hyperspace-r",
        storageBucket: "hyperspace-r.firebasestorage.app",
        messagingSenderId: "1050495683444",
        appId: "1:1050495683444:web:846c42d274197b20313a21"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const app = {
        me: {},
        activeRoom: null,
        
        async login() {
            const email = document.getElementById('email-in').value.trim();
            const nick = document.getElementById('nick-in').value.trim();
            if(!email || !nick) return;

            const cred = await auth.signInAnonymously();
            this.me = { id: cred.user.uid, name: nick, email: email, isAdmin: (email === 'admin@rileysargent.github.io') };
            
            await db.ref(`users/${this.me.id}`).update(this.me);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('my-name-display').innerText = nick;
            document.getElementById('my-small-avatar').innerText = nick[0];
            
            this.loadDMs();
        },

        loadDMs() {
            db.ref('users').on('value', snap => {
                const list = document.getElementById('channel-list');
                list.innerHTML = '';
                snap.forEach(u => {
                    if(u.key === this.me.id) return;
                    const div = document.createElement('div');
                    div.className = 'nav-item';
                    div.innerHTML = `<div class="avatar" style="width:24px; height:24px; font-size:10px; display:flex; align-items:center; justify-content:center; background:var(--accent)">${u.val().name[0]}</div> ${u.val().name}`;
                    div.onclick = () => {
                        const room = this.me.id < u.key ? `${this.me.id}_${u.key}` : `${u.key}_${this.me.id}`;
                        this.openChat(`dms/${room}`, u.val().name);
                    };
                    list.appendChild(div);
                });
            });
        },

        openChat(path, name) {
            this.activeRoom = path;
            document.getElementById('chat-header').innerText = `# ${name}`;
            const box = document.getElementById('message-scroller');
            box.innerHTML = '';
            
            db.ref(`${path}/messages`).off();
            db.ref(`${path}/messages`).limitToLast(50).on('child_added', snap => {
                const m = snap.val();
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `
                    <div class="avatar" style="background:var(--accent); display:flex; align-items:center; justify-content:center;">${m.name[0]}</div>
                    <div class="msg-body">
                        <div class="msg-user">${m.name} <span class="msg-time">${new Date(m.time).toLocaleTimeString()}</span></div>
                        <div class="msg-content">${m.text}</div>
                    </div>
                `;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;
            });
        },

        sendMessage() {
            const input = document.getElementById('chat-input');
            if(!input.value.trim() || !this.activeRoom) return;
            db.ref(`${this.activeRoom}/messages`).push({
                uid: this.me.id,
                name: this.me.name,
                text: input.value,
                time: Date.now()
            });
            input.value = '';
        },

        toggleSettings() {
            const ui = document.getElementById('settings-ui');
            ui.style.display = ui.style.display === 'none' ? 'flex' : 'none';
            if(ui.style.display === 'flex') this.setPage('account');
        },

        setPage(page) {
            const render = document.getElementById('page-render');
            if(page === 'account') {
                render.innerHTML = `
                    <h2>My Account</h2>
                    <div class="account-card">
                        <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
                            <div class="avatar" style="width:80px; height:80px; font-size:32px; display:flex; align-items:center; justify-content:center; background:var(--accent)">${this.me.name[0]}</div>
                            <h3>${this.me.name}<span style="color:var(--text-muted)">#0001</span></h3>
                        </div>
                        <div class="setting-row">
                            <div><div style="font-size:12px; color:var(--text-muted)">USERNAME</div><div>${this.me.name}</div></div>
                            <button style="padding:6px 16px; background:#4e5058; color:white; border:none; border-radius:3px;">Edit</button>
                        </div>
                        <div class="setting-row">
                            <div><div style="font-size:12px; color:var(--text-muted)">EMAIL</div><div>${this.me.email}</div></div>
                            <button style="padding:6px 16px; background:#4e5058; color:white; border:none; border-radius:3px;">Edit</button>
                        </div>
                    </div>
                    <h3 style="margin-top:30px;">Password and Authentication</h3>
                    <button style="margin-top:15px; padding:10px 20px; background:var(--accent); color:white; border:none; border-radius:3px;">Change Password</button>
                `;
            } else if(page === 'server-overview') {
                render.innerHTML = `
                    <h2>Server Overview</h2>
                    <div style="display:flex; gap:30px; margin-top:20px;">
                        <div class="guild-icon" style="width:100px; height:100px; font-size:40px; background:var(--bg-settings)">S</div>
                        <div style="flex:1">
                            <div style="font-size:12px; color:var(--text-muted)">SERVER NAME</div>
                            <input type="text" value="My Awesome Server" style="width:100%; padding:10px; background:#1e1e1e; border:none; color:white; margin-top:8px;">
                        </div>
                    </div>
                    <div class="setting-row" style="margin-top:40px;">
                        <div>Default Notifications</div>
                        <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                    </div>
                `;
            } else {
                render.innerHTML = `<h2>${page}</h2><p style="color:var(--text-muted); margin-top:10px;">Settings for ${page} coming soon in the next build.</p>`;
            }
        }
    };

    document.getElementById('chat-input').onkeypress = e => { if(e.key === 'Enter') app.sendMessage(); };
</script>
</body>
</html>
