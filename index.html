<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dell Optiplex 7010 Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #ccc; font-family: "Courier New", monospace; height: 100%; overflow: hidden; }
        #boot-screen { padding: 30px; display: flex; flex-direction: column; justify-content: space-between; height: 60vh; }
        .dell-logo { color: #fff; font-size: 38px; font-weight: bold; border: 3px solid #fff; display: inline-block; padding: 5px 20px; border-radius: 50px; }
        
        /* The Simulator Display */
        #screen-container { display: none; width: 100vw; height: 70vh; background: #000; }
        #screen canvas { display: block; margin: 0 auto; }

        /* The Virtual Console / Terminal */
        #terminal {
            height: 25vh; width: 100%; background: #0a0a0a; border-top: 2px solid #333;
            color: #0f0; font-size: 12px; overflow-y: auto; padding: 10px; box-sizing: border-box;
        }
        .log-error { color: #f44; }
        .log-warn { color: #ff0; }

        /* Controls */
        #bios-ui { position: fixed; top: 200px; left: 30px; background: rgba(20,20,20,0.9); padding: 20px; border: 1px solid #0056b3; width: 300px; z-index: 100; }
        .btn { background: #0056b3; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; font-weight: bold; }
        input[type="file"] { margin: 10px 0; font-size: 12px; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div>
            <div class="dell-logo">DELL</div>
            <p>Optiplex 7010 | BIOS A29</p>
            <p>KEK Mode: <span style="color:red">ACTIVE</span></p>
        </div>
        <p>F12: Boot Menu | System Time: <span id="clock"></span></p>
    </div>

    <div id="screen-container"><div id="screen"></div></div>

    <div id="bios-ui">
        <label>Insert Bootable Media:</label>
        <input type="file" id="iso-input">
        <button class="btn" onclick="powerOn()">START SYSTEM</button>
    </div>

    <div id="terminal" id="term-body">
        <div>[ SYSTEM ] Initializing virtual console...</div>
    </div>

    <script>
        // --- VIRTUAL TERMINAL LOGIC ---
        const terminal = document.getElementById('terminal');
        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = type === 'error' ? 'log-error' : (type === 'warn' ? 'log-warn' : '');
            line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Redirect browser errors to our virtual terminal
        window.onerror = (m, u, l) => log(`Uncaught Error: ${m} at line ${l}`, 'error');
        console.error = (m) => log(`Console Error: ${m}`, 'error');
        console.warn = (m) => log(`Console Warn: ${m}`, 'warn');
        console.log = (m) => log(m, 'info');

        // Update BIOS Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        async function loadScript(url) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = url;
                s.onload = resolve;
                s.onerror = () => reject(new Error("CDN Connection Refused"));
                document.head.appendChild(s);
            });
        }

        async function powerOn() {
            const file = document.getElementById('iso-input').files[0];
            if (!file) { log("Alert! Boot failure: No media detected.", "error"); return; }

            log("Starting POST...");
            document.getElementById('bios-ui').style.display = 'none';

            try {
                // Using JSDelivr for GitHub compatibility
                log("Downloading libv86.js from GitHub CDN...");
                await loadScript("https://cdn.jsdelivr.net/gh/copy/v86@master/build/libv86.js");
                log("v86 Library Loaded successfully.");

                log(`Reading ISO: ${file.name} (${Math.round(file.size/1024/1024)}MB)`);
                const buffer = await file.arrayBuffer();
                log("Buffer mapped to virtual SATA 0.");

                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('screen-container').style.display = 'block';

                log("Launching Emulator...");
                window.emulator = new V86Starter({
                    wasm_path: "https://cdn.jsdelivr.net/gh/copy/v86@master/build/v86.wasm",
                    memory_size: 512 * 1024 * 1024,
                    vga_memory_size: 16 * 1024 * 1024,
                    screen_container: document.getElementById("screen"),
                    bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
                    vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
                    cdrom: { buffer: buffer },
                    autostart: true,
                });

                log("SeaBIOS initialized. Waiting for bootloader...");

            } catch (e) {
                log(`CRITICAL HALT: ${e.message}`, "error");
                document.getElementById('bios-ui').style.display = 'block';
            }
        }
    </script>
</body>
</html>
