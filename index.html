<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperspace Scrabble - Pro Edition</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --tile: #e1b382;
        }

        body {
            background-color: var(--bg);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Lobby & Account UI */
        #auth-overlay, #lobby-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .window {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #444;
            color: white;
        }

        /* Game Layout */
        #app-container {
            display: none; /* Hidden until auth */
            grid-template-columns: 300px 1fr 300px;
            gap: 10px;
            padding: 10px;
            height: 100%;
        }

        .sidebar { background: var(--surface); padding: 15px; border-radius: 8px; overflow-y: auto; }
        
        #board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #scrabble-board {
            display: grid;
            grid-template-columns: repeat(15, 45px);
            grid-template-rows: repeat(15, 45px);
            gap: 2px;
            background: #000;
            padding: 5px;
            border: 4px solid #333;
        }

        .slot {
            width: 45px;
            height: 45px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .slot.tw { background: #ff4d4d; } .slot.dw { background: #ffafaf; color: #000; }
        .slot.tl { background: #3399ff; } .slot.dl { background: #add8e6; color: #000; }

        .tile {
            width: 40px;
            height: 40px;
            background: var(--tile);
            color: #3e2723;
            font-size: 20px;
            font-weight: 800;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #8d6e63;
        }

        .active-game-item {
            padding: 10px;
            border-bottom: 1px solid #444;
            cursor: pointer;
        }
        .active-game-item:hover { background: #333; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="window">
            <h2>Hyperspace Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="handleAuth('login')">Login</button>
            <button class="btn secondary" onclick="handleAuth('signup')">Sign Up</button>
        </div>
    </div>

    <div id="lobby-screen" class="hidden">
        <div class="window" style="width: 600px;">
            <h2>Game Lobby</h2>
            <div id="game-list" style="height: 200px; overflow-y: auto; background: #111; margin-bottom: 10px;">
                </div>
            <hr>
            <h3>Host New Game</h3>
            <select id="game-mode">
                <option value="local">Local Multiplayer (Pass & Play)</option>
                <option value="online">Online Multiplayer</option>
            </select>
            <select id="dictionary-type">
                <option value="standard">Standard (SOWPODS)</option>
                <option value="casual">Casual (No validation)</option>
            </select>
            <button class="btn" onclick="createNewGame()">Create Game</button>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <h3>Player Info</h3>
            <div id="user-display">Not logged in</div>
            <button onclick="signOut()">Sign Out</button>
            <hr>
            <h3>Active Games</h3>
            <div id="mini-game-list"></div>
        </div>

        <div id="board-container">
            <div id="scrabble-board"></div>
            <div id="player-rack" style="display:flex; gap:10px; margin-top:20px; padding:15px; background:#222; border-radius:10px;"></div>
        </div>

        <div class="sidebar">
            <h3 id="turn-indicator">Turn: Player 1</h3>
            <div id="score-box"></div>
            <hr>
            <div id="game-controls">
                <button class="btn" onclick="gameEngine.submitMove()">Play Move</button>
                <button class="btn" onclick="gameEngine.recallTiles()">Recall</button>
            </div>
            <div id="chat-box" style="margin-top:20px; height:150px; background:#111;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut as firebaseSignOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
            authDomain: "hyperspace-r.firebaseapp.com",
            databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hyperspace-r",
            storageBucket: "hyperspace-r.firebasestorage.app",
            messagingSenderId: "1050495683444",
            appId: "1:1050495683444:web:846c42d274197b20313a21"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        let currentUser = null;

        // --- AUTHENTICATION ---
        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if(type === 'signup') await createUserWithEmailAndPassword(auth, email, pass);
                else await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('lobby-screen').classList.remove('hidden');
                document.getElementById('user-display').innerText = user.email;
                loadGameList();
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
            }
        });

        window.signOut = () => firebaseSignOut(auth);

        // --- LOBBY SYSTEM ---
        function loadGameList() {
            const q = query(collection(db, "games"), where("status", "==", "LOBBY"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('game-list');
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = 'active-game-item';
                    item.innerHTML = `<strong>${data.hostEmail}'s Game</strong> - ${data.mode} - ${data.dictionary}`;
                    item.onclick = () => joinGame(doc.id);
                    list.appendChild(item);
                });
            });
        }

        window.createNewGame = async () => {
            const mode = document.getElementById('game-mode').value;
            const dict = document.getElementById('dictionary-type').value;
            
            const newGame = {
                hostId: currentUser.uid,
                hostEmail: currentUser.email,
                mode: mode,
                dictionary: dict,
                status: "LOBBY",
                createdAt: Date.now(),
                players: [currentUser.uid],
                turnIndex: 0
            };

            const docRef = await addDoc(collection(db, "games"), newGame);
            startGame(docRef.id, mode);
        };

        // --- GAME ENGINE ---
        class ScrabbleEngine {
            constructor() {
                this.isLocal = true;
                this.currentPlayer = 0;
                this.scores = [0, 0];
                this.board = Array(15).fill().map(() => Array(15).fill(null));
            }

            initUI() {
                const boardEl = document.getElementById('scrabble-board');
                boardEl.innerHTML = '';
                for(let r=0; r<15; r++) {
                    for(let c=0; c<15; c++) {
                        const div = document.createElement('div');
                        div.className = 'slot';
                        div.dataset.pos = `${r},${c}`;
                        boardEl.appendChild(div);
                    }
                }
                document.getElementById('app-container').style.display = 'grid';
                document.getElementById('lobby-screen').classList.add('hidden');
            }

            drawTiles() {
                const rack = document.getElementById('player-rack');
                rack.innerHTML = '';
                for(let i=0; i<7; i++) {
                    const t = document.createElement('div');
                    t.className = 'tile';
                    t.innerText = "ABC"[Math.floor(Math.random()*3)]; // Simplified
                    rack.appendChild(t);
                }
            }

            submitMove() {
                alert("Move Submitted!");
                if(this.isLocal) {
                    this.currentPlayer = this.currentPlayer === 0 ? 1 : 0;
                    document.getElementById('turn-indicator').innerText = `Turn: Player ${this.currentPlayer + 1}`;
                }
            }
        }

        const gameEngine = new ScrabbleEngine();
        window.gameEngine = gameEngine;

        function startGame(id, mode) {
            gameEngine.isLocal = (mode === 'local');
            gameEngine.initUI();
            gameEngine.drawTiles();
        }

    </script>
</body>
</html>
