<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleVC | Bedrock Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="app-container">
        <h2>SimpleVC Bridge</h2>
        
        <div id="status-bar">
            Status: <span id="status-text" class="disconnected">Connecting...</span>
        </div>

        <div id="setup">
            <input type="text" id="username" placeholder="Minecraft Username" style="padding: 10px; width: 80%; margin-bottom: 10px; border-radius: 4px; border: none;">
            <button id="start-btn" onclick="initVoice()">Connect to Voice</button>
        </div>

        <div id="vc-controls" style="display: none;">
            <div id="player-list">
                </div>
            
            <button id="mic-toggle" onclick="toggleMic()">🎤 Mute Mic</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myPeer;
        let localStream;
        let myUsername = "";
        const activeCalls = {};

        async function initVoice() {
            myUsername = document.getElementById('username').value;
            if (!myUsername) return alert("Enter your Minecraft Name!");

            // 1. Get Microphone
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('setup').style.display = 'none';
                document.getElementById('vc-controls').style.display = 'block';
                document.getElementById('status-text').innerText = "Voice Online";
                document.getElementById('status-text').className = "connected";
            } catch (err) {
                alert("Microphone access denied!");
                return;
            }

            // 2. Initialize PeerJS with your Minecraft Name as ID
            myPeer = new Peer(myUsername, {
                host: 'simplevc.onrender.com', // Replace with your Render Peer server or use PeerJS cloud
                secure: true,
                port: 443
            });

            // 3. Listen for incoming "calls" (other players nearby)
            myPeer.on('call', call => {
                call.answer(localStream);
                setupRemoteAudio(call);
            });

            // 4. Tell the server we are ready
            socket.emit('player-ready', { username: myUsername });
        }

        function setupRemoteAudio(call) {
            const audio = document.createElement('audio');
            call.on('stream', remoteStream => {
                audio.srcObject = remoteStream;
                audio.play();
                // This is where you'd link the PannerNode for 3D sound!
            });
        }

        function toggleMic() {
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            const btn = document.getElementById('mic-toggle');
            btn.innerText = audioTrack.enabled ? "🎤 Mute Mic" : "🔇 Unmuted";
            btn.classList.toggle('active', !audioTrack.enabled);
        }

        // Update the list of players based on Minecraft data
        socket.on('positions-update', (data) => {
            const list = document.getElementById('player-list');
            list.innerHTML = "";
            Object.keys(data).forEach(player => {
                if(player === myUsername) return;
                list.innerHTML += `
                    <div class="player-card">
                        <span>${player}</span>
                        <div class="voice-indicator"></div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
