<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiplash but Not • v1.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        
        /* Easter Egg Master Animations */
        @keyframes jumpScareIn {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(-20deg); opacity: 0; filter: blur(10px); }
            30% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; filter: blur(0px); }
            80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0) rotate(720deg); opacity: 0; }
        }
        @keyframes laserRainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes earthquake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 4px) rotate(-1deg); }
            40% { transform: translate(-4px, -2px) rotate(1deg); }
            60% { transform: translate(4px, 4px) rotate(0deg); }
            80% { transform: translate(4px, -2px) rotate(-1deg); }
        }
        @keyframes glitchEffect {
            0%, 100% { filter: hue-rotate(0deg); text-shadow: 2px 2px #f43f5e; }
            50% { filter: hue-rotate(180deg); text-shadow: -2px -2px #06b6d4; background-color: #000; }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) scale(0.5); opacity: 1; }
            100% { transform: translateY(105vh) scale(1.2); opacity: 0; }
        }

        .animate-scare { animation: jumpScareIn 2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .laser-bg {
            background: linear-gradient(-45deg, #ef4444, #ec4899, #3b82f6, #10b981);
            background-size: 400% 400%;
            animation: laserRainbow 1s ease infinite;
        }
        .animate-earthquake { animation: earthquake 0.15s ease infinite; }
        .animate-glitch { animation: glitchEffect 0.2s ease infinite; }
        
        .confetti-piece {
            position: fixed;
            top: -5%;
            font-size: 2rem;
            pointer-events: none;
            z-index: 40;
            animation: confettiFall 2.5s linear forwards;
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, runTransaction, remove, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
            authDomain: "hyperspace-r.firebaseapp.com",
            databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hyperspace-r",
            storageBucket: "hyperspace-r.firebasestorage.app",
            messagingSenderId: "1050495683444",
            appId: "1:1050495683444:web:42d7284bee34d749313a21"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userId = "user_" + Math.random().toString(36).substr(2, 9);
        let userName = "";
        let currentRoom = "";
        let roomCodeGlobal = "";
        let isHost = false; 
        let userRole = ""; 
        let roomState = null;
        let gameMode = "quiplash"; 

        // WebRTC Infrastructure
        let localStream = null;
        const peerConnections = {}; 
        const iceServers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        let mediaFlags = { audioEnabled: false, videoEnabled: false, deafened: false };

        const badWordsFilter = ["fuck", "shit", "asshole", "bitch", "cunt", "dick"];
        function cleanContent(text) {
            let sanitized = text;
            badWordsFilter.forEach(word => {
                const regex = new RegExp(word, "gi");
                sanitized = sanitized.replace(regex, "[REDACTED]");
            });
            return sanitized;
        }

        const screens = {
            username: document.getElementById('screen-username'),
            room: document.getElementById('screen-room'),
            game: document.getElementById('screen-game')
        };

        const elements = {
            usernameInput: document.getElementById('username-input'),
            nextBtn: document.getElementById('next-btn'),
            roomInput: document.getElementById('room-input'),
            hostRoomBtn: document.getElementById('host-room-btn'),
            joinPlayerBtn: document.getElementById('join-player-btn'),
            joinAudienceBtn: document.getElementById('join-audience-btn'),
            activeGamesList: document.getElementById('active-games-list'),
            displayRoomCode: document.getElementById('display-room-code'),
            totalCounter: document.getElementById('total-counter'),
            playerList: document.getElementById('player-list'),
            audienceCount: document.getElementById('audience-count'),
            hostControls: document.getElementById('host-controls'),
            startBtn: document.getElementById('start-btn'),
            leaveRoomBtn: document.getElementById('leave-room-btn'),
            phaseContainer: document.getElementById('phase-container'),
            chatBox: document.getElementById('chat-box'),
            chatInput: document.getElementById('chat-input'),
            chatSendBtn: document.getElementById('chat-send-btn'),
            toggleAudioBtn: document.getElementById('toggle-audio-btn'),
            toggleVideoBtn: document.getElementById('toggle-video-btn'),
            toggleDeafBtn: document.getElementById('toggle-deaf-btn'),
            localVideoPreview: document.getElementById('local-video-preview'),
            videoGridContainer: document.getElementById('video-grid-container'),
            scareOverlay: document.getElementById('scare-overlay'),
            brandTitle: document.getElementById('brand-title'),
            footerBuild: document.getElementById('footer-build')
        };

        elements.nextBtn.addEventListener('click', () => {
            userName = cleanContent(elements.usernameInput.value.trim());
            if (!userName) return alert("Enter nickname!");
            screens.username.classList.add('hidden');
            screens.room.classList.remove('hidden');
            initGlobalRoomListener();
        });

        elements.hostRoomBtn.addEventListener('click', () => {
            const code = elements.roomInput.value.trim().toUpperCase();
            if(!code) return alert("Enter code!");
            isHost = true; 
            connectToRoom(code, 'player');
        });

        elements.joinPlayerBtn.addEventListener('click', () => {
            const code = elements.roomInput.value.trim().toUpperCase();
            if(!code) return alert("Enter code!");
            isHost = false;
            connectToRoom(code, 'player');
        });

        elements.joinAudienceBtn.addEventListener('click', () => {
            const code = elements.roomInput.value.trim().toUpperCase();
            if(!code) return alert("Enter code!");
            isHost = false;
            connectToRoom(code, 'audience');
        });

        elements.leaveRoomBtn.addEventListener('click', leaveSessionRoute);

        function initGlobalRoomListener() {
            onValue(ref(db, 'game_directory'), (snapshot) => {
                const directory = snapshot.val();
                elements.activeGamesList.innerHTML = "";
                if (!directory) return;
                Object.keys(directory).forEach(roomCode => {
                    const info = directory[roomCode];
                    const div = document.createElement('div');
                    div.className = "p-2.5 bg-slate-950 border border-slate-850 rounded-xl flex justify-between items-center";
                    div.innerHTML = `
                        <div>
                            <span class="font-mono text-xs font-bold text-white">${roomCode}</span>
                            <span class="text-[9px] bg-slate-900 text-slate-400 px-1 py-0.5 rounded ml-2 uppercase">${info.mode || "Quiplash"}</span>
                        </div>
                        <div class="flex gap-1.5">
                            <button class="bg-indigo-600 px-2 py-0.5 text-[10px] font-bold rounded text-white" onclick="window.directJoin('${roomCode}', 'player')">Play</button>
                        </div>
                    `;
                    elements.activeGamesList.appendChild(div);
                });
            });
        }

        window.directJoin = (roomCode, role) => {
            isHost = false;
            connectToRoom(roomCode, role);
        };

        function connectToRoom(roomCode, role) {
            roomCodeGlobal = roomCode;
            currentRoom = "room_" + roomCode;
            userRole = role;
            elements.displayRoomCode.innerText = `ROOM: ${roomCode}`;

            const roomRef = ref(db, `rooms/${currentRoom}`);
            runTransaction(roomRef, (currentData) => {
                if (!currentData) {
                    if (!isHost) return; 
                    return {
                        roomCode: roomCode, hostId: userId, phase: "LOBBY", gameMode: "quiplash",
                        users: {}, currentPrompt: "", promptWriter: "", answerWriters: [],
                        answers: {}, votes: {}, chat: {}, signals: {}, triggers: {}, trueAnswer: "Real Fact"
                    };
                }
                return currentData;
            }).then((result) => {
                const roomVal = result.snapshot.val();
                
                if (!roomVal) return;

                if (roomVal.hostId === userId) {
                    isHost = true;
                    elements.hostControls.classList.remove('hidden');
                    
                    // Host-Specific Disconnection Rule: Wipes everything
                    onDisconnect(ref(db, `rooms/${currentRoom}`)).remove();
                    onDisconnect(ref(db, `game_directory/${roomCode}`)).remove();
                } else {
                    // Regular Player Disconnection Rule
                    onDisconnect(ref(db, `rooms/${currentRoom}/users/${userId}`)).remove();
                }

                update(ref(db, `game_directory/${roomCode}`), { phase: "LOBBY", mode: roomVal.gameMode || "quiplash" });

                set(ref(db, `rooms/${currentRoom}/users/${userId}`), {
                    id: userId, name: userName, role: role, score: 0, isHost: isHost,
                    mediaState: { audio: false, video: false, deaf: false }
                }).then(() => {
                    screens.room.classList.add('hidden');
                    screens.game.classList.remove('hidden');
                    listenToGameRoom();
                    listenToChat();
                    initWebRTCSignaling();
                    listenToEasterEggs();
                });
            }).catch((err) => {
                console.warn("Retrying transaction mapping safely...", err);
            });
        }

        async function leaveSessionRoute() {
            if (isHost) {
                await remove(ref(db, `rooms/${currentRoom}`));
                await remove(ref(db, `game_directory/${roomCodeGlobal}`));
            } else if (currentRoom && userId) {
                await remove(ref(db, `rooms/${currentRoom}/users/${userId}`));
            }
            location.reload();
        }

        /* HARDWARE ACCESS CAPTURE SUITE */
        async function maintainLocalStream() {
            if (!mediaFlags.audioEnabled && !mediaFlags.videoEnabled) {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                elements.localVideoPreview.classList.add('hidden');
                syncMediaStateToDatabase();
                return;
            }
            try {
                const constraints = { audio: true, video: mediaFlags.videoEnabled ? { width: 320, height: 240 } : false };
                const newStream = await navigator.mediaDevices.getUserMedia(constraints);
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                localStream = newStream;

                if (!mediaFlags.audioEnabled) localStream.getAudioTracks().forEach(t => t.enabled = false);

                if (mediaFlags.videoEnabled) {
                    elements.localVideoPreview.srcObject = localStream;
                    elements.localVideoPreview.classList.remove('hidden');
                } else {
                    elements.localVideoPreview.classList.add('hidden');
                }

                Object.values(peerConnections).forEach(pc => {
                    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                });
            } catch (err) {
                mediaFlags.audioEnabled = false; mediaFlags.videoEnabled = false;
                updateAVControlUIElements();
            }
            syncMediaStateToDatabase();
        }

        function syncMediaStateToDatabase() {
            if (!currentRoom || !userId) return;
            update(ref(db, `rooms/${currentRoom}/users/${userId}/mediaState`), {
                audio: mediaFlags.audioEnabled, video: mediaFlags.videoEnabled, deaf: mediaFlags.deafened
            });
        }

        elements.toggleAudioBtn.addEventListener('click', () => { mediaFlags.audioEnabled = !mediaFlags.audioEnabled; updateAVControlUIElements(); maintainLocalStream(); });
        elements.toggleVideoBtn.addEventListener('click', () => { mediaFlags.videoEnabled = !mediaFlags.videoEnabled; updateAVControlUIElements(); maintainLocalStream(); });
        elements.toggleDeafBtn.addEventListener('click', () => {
            mediaFlags.deafened = !mediaFlags.deafened;
            if (mediaFlags.deafened) mediaFlags.audioEnabled = false;
            updateAVControlUIElements();
            maintainLocalStream();
        });

        function updateAVControlUIElements() {
            elements.toggleAudioBtn.innerText = mediaFlags.audioEnabled ? "Mute Mic" : "Mic On";
            elements.toggleVideoBtn.innerText = mediaFlags.videoEnabled ? "Cam Off" : "Cam On";
            elements.toggleDeafBtn.innerText = mediaFlags.deafened ? "Undeafen" : "Deafen";
        }

        /* WEBRTC SIGNALING ROUTERS */
        function initWebRTCSignaling() {
            onValue(ref(db, `rooms/${currentRoom}/signals/${userId}`), (snapshot) => {
                const signals = snapshot.val(); if (!signals) return;
                Object.keys(signals).forEach(async senderId => {
                    const data = signals[senderId];
                    if (data.type === "offer" && !peerConnections[senderId]) {
                        await handleInboundOffer(senderId, data.sdp);
                    }
                });
            });
        }

        async function handleInboundOffer(senderId, sdp) {
            const pc = new RTCPeerConnection(iceServers);
            peerConnections[senderId] = pc;
            if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.ontrack = (e) => {
                if (e.track.kind === 'video') {
                    setTimeout(() => {
                        const el = document.getElementById(`video_feed_${senderId}`);
                        if(el) el.srcObject = e.streams[0];
                    }, 500);
                }
            };
            await pc.setRemoteDescription(new RTCSessionDescription(sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            set(ref(db, `rooms/${currentRoom}/signals/${senderId}/${userId}`), { type: "answer", sdp: answer.toJSON() });
        }

        /* CORE GAME LOOP ENGINE */
        function listenToGameRoom() {
            onValue(ref(db, `rooms/${currentRoom}`), (snapshot) => {
                const data = snapshot.val(); 
                
                // Vacant Sweep Engine: Delete paths completely if room contains absolutely nobody
                if (data && (!data.users || Object.keys(data.users).length === 0)) {
                    remove(ref(db, `rooms/${currentRoom}`));
                    remove(ref(db, `game_directory/${roomCodeGlobal}`));
                    return;
                }

                // If host killed the room data, kick players out
                if (!data) {
                    if (!isHost) {
                        alert("The host closed the room session.");
                        location.reload();
                    }
                    return;
                }
                
                roomState = data;
                gameMode = data.gameMode || "quiplash";
                applyThemeStyling();
                renderRoomState();
            });
        }

        function applyThemeStyling() {
            if (gameMode === "fibbage") {
                elements.brandTitle.innerText = "FIBBAGE 4 BUT NOT";
                elements.footerBuild.innerText = "Fibbage 4 but Not • Client Build v1.4 (Beta Edition)";
                document.body.className = "bg-stone-950 text-stone-100 min-h-screen font-sans flex flex-col justify-between transition-all duration-500";
            } else {
                elements.brandTitle.innerText = "QUIPLASH BUT NOT";
                elements.footerBuild.innerText = "Quiplash but Not • Client Build v1.4 (Stable Release)";
                document.body.className = "bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between transition-all duration-500";
            }
        }

        function renderRoomState() {
            const usersList = roomState.users ? Object.values(roomState.users) : [];
            const players = usersList.filter(u => u.role === 'player');
            elements.totalCounter.innerText = `Capacity: ${usersList.length} / 1000`;
            elements.audienceCount.innerText = `${usersList.filter(u => u.role === 'audience').length} Live`;

            elements.playerList.innerHTML = players.map(p => `
                <div class="p-2 bg-slate-900 border border-slate-800 rounded-lg flex justify-between items-center text-xs">
                    <span class="font-medium truncate">${p.name} ${p.isHost ? '<b class="text-amber-500 text-[9px] ml-1">[HOST]</b>' : ''}</span>
                    <span class="text-[10px] text-amber-400 font-mono">Score: ${p.score || 0}</span>
                </div>
            `).join('');

            // Safe Gate Logic: Game requires minimum of 4 players to initiate arena sequence
            if (roomState.hostId === userId) {
                if (players.length >= 4) {
                    elements.startBtn.disabled = false;
                    elements.startBtn.innerText = "Begin Round";
                } else {
                    elements.startBtn.disabled = true;
                    elements.startBtn.innerText = `Need ${4 - players.length} More Players`;
                }
            }

            switch(roomState.phase) {
                case "LOBBY":
                    elements.phaseContainer.innerHTML = `<div class="text-center py-8 bg-black/40 border border-slate-800 rounded-xl"><h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400 animate-pulse">Waiting in Lobby Mode...</h2></div>`;
                    break;
                case "PROMPT_PHASE": renderPromptPhase(); break;
                case "ANSWER_PHASE": renderAnswerPhase(); break;
                case "VOTING_PHASE": renderVotingPhase(players); break;
                case "RESULTS_PHASE": renderResultsPhase(); break;
            }
        }

        elements.startBtn.addEventListener('click', () => {
            if (roomState.hostId !== userId) return;
            const players = Object.values(roomState.users).filter(u => u.role === 'player');
            if (players.length < 4) return; // double-check verification gate
            
            const targetWriter = players[Math.floor(Math.random() * players.length)].id;
            update(ref(db, `rooms/${currentRoom}`), {
                phase: "PROMPT_PHASE", promptWriter: targetWriter,
                currentPrompt: "", answers: null, votes: null, trueAnswer: "Real Truth"
            });
        });

        function renderPromptPhase() {
            if (roomState.promptWriter === userId) {
                elements.phaseContainer.innerHTML = `
                    <div class="bg-slate-900 p-4 rounded-xl border border-indigo-500/20">
                        <h3 class="text-xs font-bold text-indigo-400 uppercase mb-2">${gameMode === 'fibbage' ? 'Enter Fact & Real Answer:' : 'Create Prompt Question:'}</h3>
                        <input type="text" id="p-input" placeholder="${gameMode === 'fibbage' ? 'In 2026, scientists discovered a new species of ___' : 'Worst thing to say at dinner'}" class="w-full p-2 bg-slate-950 border border-slate-800 rounded text-xs mb-2 text-white focus:outline-none">
                        ${gameMode === 'fibbage' ? '<input type="text" id="t-input" placeholder="The real truth answer" class="w-full p-2 bg-slate-950 border border-slate-800 rounded text-xs mb-2 text-white focus:outline-none">' : ''}
                        <button id="sub-prompt" class="w-full bg-indigo-600 text-white text-xs py-1.5 rounded font-bold">Launch to Arena</button>
                    </div>
                `;
                document.getElementById('sub-prompt').addEventListener('click', () => {
                    const promptVal = cleanContent(document.getElementById('p-input').value.trim());
                    const trueVal = gameMode === 'fibbage' ? cleanContent(document.getElementById('t-input').value.trim()) : "";
                    if (!promptVal) return;
                    
                    const players = Object.values(roomState.users).filter(u => u.role === 'player');
                    const answerers = players.map(p => p.id);

                    update(ref(db, `rooms/${currentRoom}`), {
                        currentPrompt: promptVal, trueAnswer: trueVal || "Real Answer",
                        answerWriters: answerers, phase: "ANSWER_PHASE"
                    });
                });
            } else {
                elements.phaseContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-500 italic">Constructing prompt infrastructure configuration...</div>`;
            }
        }

        function renderAnswerPhase() {
            if (roomState.answers?.[userId]) {
                elements.phaseContainer.innerHTML = `<div class="text-center py-6 text-xs text-emerald-400 font-bold">Answer logged. Awaiting remaining participants...</div>`;
                return;
            }
            elements.phaseContainer.innerHTML = `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span class="text-[9px] font-bold text-amber-400 block uppercase mb-1">PROMPT CONFIGURATION:</span>
                    <h3 class="text-sm font-bold text-white mb-3">"${roomState.currentPrompt}"</h3>
                    <input type="text" id="a-input" placeholder="${gameMode === 'fibbage' ? 'Enter a clever lie to fool others...' : 'Enter response...'}" class="w-full p-2 bg-slate-950 border border-slate-800 rounded text-xs mb-2 focus:outline-none text-white">
                    <button id="sub-ans" class="w-full bg-amber-500 text-slate-955 text-xs py-1.5 rounded font-bold">Submit Response</button>
                </div>
            `;
            document.getElementById('sub-ans').addEventListener('click', () => {
                const text = cleanContent(document.getElementById('a-input').value.trim());
                if (!text) return;
                set(ref(db, `rooms/${currentRoom}/answers/${userId}`), { userId: userId, text: text }).then(() => {
                    runTransaction(ref(db, `rooms/${currentRoom}`), (c) => {
                        if (c && Object.keys(c.answers || {}).length >= Object.keys(c.users).filter(id => c.users[id].role==='player').length) c.phase = "VOTING_PHASE";
                        return c;
                    });
                });
            });
        }

        function renderVotingPhase(players) {
            if (roomState.votes?.[userId]) {
                elements.phaseContainer.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">Choice locked in!</div>`;
                return;
            }
            elements.phaseContainer.innerHTML = `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <h3 class="text-xs font-bold text-center text-white mb-3">"${roomState.currentPrompt}"</h3>
                    <p class="text-[10px] text-slate-400 text-center mb-2">${gameMode === 'fibbage' ? 'Find the TRUTH! Avoid the lies:' : 'Vote for your favorite answer:'}</p>
                    <div id="vote-options-box" class="space-y-1.5"></div>
                </div>
            `;
            const box = document.getElementById('vote-options-box');
            
            let optionsList = Object.values(roomState.answers || {});
            if (gameMode === "fibbage") {
                optionsList.push({ userId: "TRUTH_NODE", text: roomState.trueAnswer });
            }
            
            optionsList.forEach(ans => {
                if (ans.userId === userId) return; 
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-2.5 bg-slate-950 border border-slate-850 hover:border-indigo-500 text-xs rounded text-slate-200 transition-all";
                btn.innerText = ans.text;
                btn.addEventListener('click', () => {
                    set(ref(db, `rooms/${currentRoom}/votes/${userId}`), ans.userId).then(() => {
                        runTransaction(ref(db, `rooms/${currentRoom}`), (c) => {
                            if (c && Object.keys(c.votes || {}).length >= (players.length - 1)) c.phase = "RESULTS_PHASE";
                            return c;
                        });
                    });
                });
                box.appendChild(btn);
            });
        }

        function renderResultsPhase() {
            const answers = Object.values(roomState.answers || {});
            const strictlyHost = roomState.hostId === userId;
            
            elements.phaseContainer.innerHTML = `
                <div class="bg-slate-900 p-4 rounded-xl text-center text-xs border border-slate-800">
                    <h3 class="font-bold text-slate-400 mb-2">"${roomState.currentPrompt}"</h3>
                    ${gameMode === 'fibbage' ? `<div class="p-2 bg-emerald-950/40 border border-emerald-500/30 text-emerald-400 rounded mb-3 font-bold">The Truth Was: ${roomState.trueAnswer}</div>` : ''}
                    <div class="space-y-1 mb-3">
                        ${answers.map(a => `<div class="p-2 bg-slate-950 rounded border border-slate-850 text-left flex justify-between"><span><b>${roomState.users[a.userId]?.name || "Guest"}:</b> ${a.text}</span></div>`).join('')}
                    </div>
                    ${strictlyHost ? `<button id="next-round" class="w-full bg-indigo-600 text-white font-bold py-1.5 rounded">Next Iteration</button>` : `<p class="text-slate-500 italic">Awaiting host management assignment mapping...</p>`}
                </div>
            `;
            if (strictlyHost) {
                document.getElementById('next-round').addEventListener('click', () => {
                    update(ref(db, `rooms/${currentRoom}`), { phase: "PROMPT_PHASE", currentPrompt: "", answers: null, votes: null });
                });
            }
        }

        /* BROADCAST SYNCHRONIZED EASTER EGG MANAGER MODULE */
        window.addEventListener('keydown', (e) => {
            if (!currentRoom) return;

            // Alt + Shift + T -> Toggle Game Mode Architecture
            if (e.altKey && e.shiftKey && e.code === 'KeyT') {
                e.preventDefault();
                const nextMode = gameMode === "quiplash" ? "fibbage" : "quiplash";
                update(ref(db, `rooms/${currentRoom}`), { gameMode: nextMode, phase: "LOBBY" });
                update(ref(db, `game_directory/${roomCodeGlobal}`), { mode: nextMode });
                fireSyncTriggerEvent("pivot_mode", { mode: nextMode, sender: userName });
            }

            if (e.altKey && e.shiftKey && e.code === 'KeyX') { e.preventDefault(); fireSyncTriggerEvent("scare", { text: "BOO!" }); }
            if (e.altKey && e.shiftKey && e.code === 'KeyL') { e.preventDefault(); fireSyncTriggerEvent("laser", { sender: userName }); }
            if (e.altKey && e.shiftKey && e.code === 'KeyS') { e.preventDefault(); fireSyncTriggerEvent("earthquake", {}); }
            if (e.altKey && e.shiftKey && e.code === 'KeyW') { e.preventDefault(); fireSyncTriggerEvent("confetti", {}); }
            if (e.altKey && e.shiftKey && e.code === 'KeyG') { e.preventDefault(); fireSyncTriggerEvent("glitch", {}); }
        });

        function fireSyncTriggerEvent(type, payload) {
            set(ref(db, `rooms/${currentRoom}/triggers`), { id: "ev_" + Date.now(), type: type, payload: payload });
        }

        function listenToEasterEggs() {
            onValue(ref(db, `rooms/${currentRoom}/triggers`), (snapshot) => {
                const data = snapshot.val(); if (!data) return;
                
                const stage = document.getElementById('master-stage-wrapper');
                
                if (data.type === "pivot_mode") {
                    executePivotNoticeBanner(data.payload.mode, data.payload.sender);
                } else if (data.type === "scare") {
                    elements.scareOverlay.innerHTML = `<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-red-600 font-black text-8xl md:text-9xl drop-shadow-[0_8px_8px_rgba(0,0,0,1)] uppercase animate-scare">${data.payload.text}</div>`;
                    elements.scareOverlay.classList.remove('hidden');
                    setTimeout(() => { elements.scareOverlay.innerHTML = ""; elements.scareOverlay.classList.add('hidden'); }, 2000);
                } else if (data.type === "laser") {
                    executeLaserBanner(data.payload.sender);
                } else if (data.type === "earthquake") {
                    stage.classList.add('animate-earthquake');
                    setTimeout(() => stage.classList.remove('animate-earthquake'), 1500);
                } else if (data.type === "confetti") {
                    executeConfettiRainfall();
                } else if (data.type === "glitch") {
                    stage.classList.add('animate-glitch');
                    setTimeout(() => stage.classList.remove('animate-glitch'), 1200);
                }
            });
        }

        function executePivotNoticeBanner(mode, master) {
            const n = document.createElement('div');
            n.className = "fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50 text-center p-4 font-mono";
            n.innerHTML = `<h2 class="text-2xl font-black tracking-widest text-amber-500 mb-2 uppercase">TRANSMUTING ARENA MATRIX</h2><p class="text-xs text-stone-400">${master} transformed the framework structure into <br><b class="text-white text-sm uppercase">${mode} 4 But Not</b> Mode!</p>`;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 2500);
        }

        function executeLaserBanner(name) {
            const b = document.createElement('div');
            b.className = "fixed top-0 left-0 w-full p-2 text-center text-[11px] font-black tracking-widest text-white z-50 laser-bg shadow-xl";
            b.innerText = `🚨 DISCO INTERACTION MAPPED BY: ${name} 🚨`;
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 2000);
        }

        function executeConfettiRainfall() {
            const emojis = ["🎉", "✨", "🎈", "🎲", "🔥"];
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = "confetti-piece";
                p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.left = Math.random() * 100 + "vw";
                p.style.animationDelay = Math.random() * 0.5 + "s";
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 3000);
            }
        }

        function sendChatMessage() {
            const text = elements.chatInput.value.trim(); if(!text) return;
            set(ref(db, `rooms/${currentRoom}/chat/${Date.now()}`), { sender: userName, text: cleanContent(text) });
            elements.chatInput.value = "";
        }
        elements.chatSendBtn.addEventListener('click', sendChatMessage);
        elements.chatInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendChatMessage(); });

        function listenToChat() {
            onValue(ref(db, `rooms/${currentRoom}/chat`), (snapshot) => {
                const logs = snapshot.val(); if(!logs) return;
                elements.chatBox.innerHTML = Object.values(logs).map(m => `<div class="text-xs break-words"><span class="font-bold text-indigo-400">${m.sender}:</span> <span class="text-slate-300">${m.text}</span></div>`).join('');
                elements.chatBox.scrollTop = elements.chatBox.scrollHeight;
            });
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between transition-colors duration-500">

        </section>

        <section id="screen-room" class="hidden w-full max-w-md grid grid-cols-1 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                <h2 class="text-sm font-bold text-white mb-3">Create or Join Rooms</h2>
                <input type="text" id="room-input" placeholder="e.g., PARTY7" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-center font-mono uppercase tracking-widest font-bold mb-3 text-sm focus:outline-none">
                <div class="grid grid-cols-3 gap-2">
                    <button id="host-room-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-xl text-xs">Host Game</button>
                    <button id="join-player-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs">Join Player</button>
                    <button id="join-audience-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs">Join Watch</button>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
                <h3 class="text-xs font-bold text-slate-400 mb-2 uppercase">Rooms Hub Index</h3>
                <div id="active-games-list" class="space-y-1.5 max-h-36 overflow-y-auto"></div>
            </div>
        </section>

        <section id="screen-game" class="hidden w-full grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
            <div class="md:col-span-1 space-y-3">
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Players</h3>
                    <div id="player-list" class="space-y-1 max-h-32 overflow-y-auto"></div>
                </div>
                
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs flex justify-between">
                    <span class="text-slate-400 font-bold text-[10px] uppercase">Audience</span>
                    <span id="audience-count" class="font-bold text-indigo-400">0</span>
                </div>
                
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
                    <div class="relative bg-black rounded-lg aspect-video overflow-hidden">
                        <video id="local-video-preview" autoplay muted playsinline class="w-full h-full object-cover hidden scale-x-[-1]"></video>
                    </div>
                    <div class="flex gap-1">
                        <button id="toggle-audio-btn" class="bg-slate-800 text-slate-300 p-1.5 rounded text-xs flex-1 text-center">Mic On</button>
                        <button id="toggle-video-btn" class="bg-slate-800 text-slate-300 p-1.5 rounded text-xs flex-1 text-center">Cam On</button>
                    </div>
                    <button id="toggle-deaf-btn" class="w-full bg-slate-800 text-slate-300 p-1.5 rounded text-xs text-center">Deafen Audio</button>
                </div>

                <div id="host-controls" class="hidden bg-slate-900 border border-amber-500/20 p-2 rounded-xl">
                    <button id="start-btn" disabled class="w-full bg-amber-500 disabled:bg-slate-800 disabled:text-slate-500 text-slate-950 font-bold py-1 rounded text-xs uppercase">Need 4 Players</button>
                </div>
                <button id="leave-room-btn" class="w-full bg-rose-950 text-rose-400 p-2 rounded text-xs font-bold uppercase">Leave Room</button>
            </div>

            <div class="md:col-span-2 space-y-3">
                <div id="phase-container" class="w-full"></div>
                <div class="bg-slate-900 border border-slate-800 p-2 rounded-xl">
                    <h4 class="text-[10px] uppercase tracking-wider font-bold text-slate-500 mb-2 font-mono">Dynamic WebRTC Room Grid</h4>
                    <div id="video-grid-container" class="grid grid-cols-1 gap-2"></div>
                </div>

            <div class="md:col-span-1 bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col h-[350px] justify-between">

                <div class="flex gap-1">
                    <input type="text" id="chat-input" placeholder="Type..." class="flex-grow bg-slate-950 border border-slate-800 rounded text-xs p-1 text-white focus:outline-none">
                    <button id="chat-send-btn" class="bg-indigo-600 px-2 rounded text-[10px] font-bold">Send</button>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer-build" class="text-center py-2 text-[9px] text-slate-700 font-mono border-t border-slate-900">Quiplash but Not • Client Build v1.4</footer>
</body>
