<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiplash but Not</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, runTransaction, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
            authDomain: "hyperspace-r.firebaseapp.com",
            databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hyperspace-r",
            storageBucket: "hyperspace-r.firebasestorage.app",
            messagingSenderId: "1050495683444",
            appId: "1:1050495683444:web:42d7284bee34d749313a21",
            measurementId: "G-RRQTTD9M4V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Machine Variables
        let userId = "user_" + Math.random().toString(36).substr(2, 9);
        let userName = "";
        let currentRoom = "";
        let isHost = false; 
        let userRole = ""; 
        let roomState = null;

        const badWordsFilter = ["fuck", "shit", "asshole", "bitch", "cunt", "dick", "fucker", "ass", "67", "poop", "crap"];
        function cleanContent(text) {
            let sanitized = text;
            badWordsFilter.forEach(word => {
                const regex = new RegExp(word, "gi");
                sanitized = sanitized.replace(regex, "[REDACTED]");
            });
            return sanitized;
        }

        // DOM Cached Elements
        const screens = {
            username: document.getElementById('screen-username'),
            room: document.getElementById('screen-room'),
            game: document.getElementById('screen-game')
        };

        const elements = {
            usernameInput: document.getElementById('username-input'),
            nextBtn: document.getElementById('next-btn'),
            roomInput: document.getElementById('room-input'),
            createRoomBtn: document.getElementById('create-room-btn'),
            joinAudienceBtn: document.getElementById('join-audience-btn'),
            activeGamesList: document.getElementById('active-games-list'),
            displayRoomCode: document.getElementById('display-room-code'),
            totalCounter: document.getElementById('total-counter'),
            playerList: document.getElementById('player-list'),
            audienceCount: document.getElementById('audience-count'),
            hostControls: document.getElementById('host-controls'),
            startBtn: document.getElementById('start-btn'),
            phaseContainer: document.getElementById('phase-container'),
            chatBox: document.getElementById('chat-box'),
            chatInput: document.getElementById('chat-input'),
            chatSendBtn: document.getElementById('chat-send-btn')
        };

        // Step 1 -> Step 2
        elements.nextBtn.addEventListener('click', () => {
            userName = cleanContent(elements.usernameInput.value.trim());
            if (!userName) return alert("Please enter a username!");
            screens.username.classList.add('hidden');
            screens.room.classList.remove('hidden');
            initGlobalRoomListener();
        });

        // Room Operations
        elements.createRoomBtn.addEventListener('click', () => {
            const code = elements.roomInput.value.trim().toUpperCase();
            if(!code) return alert("Enter a room code!");
            connectToRoom(code, 'player');
        });

        elements.joinAudienceBtn.addEventListener('click', () => {
            const code = elements.roomInput.value.trim().toUpperCase();
            if(!code) return alert("Enter a room code!");
            connectToRoom(code, 'audience');
        });

        // Global Lobby Discovery Engine
        function initGlobalRoomListener() {
            onValue(ref(db, 'game_directory'), (snapshot) => {
                const directory = snapshot.val();
                elements.activeGamesList.innerHTML = "";
                if (!directory || Object.keys(directory).length === 0) {
                    elements.activeGamesList.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-4">No active rooms found. Create one above!</p>`;
                    return;
                }
                Object.keys(directory).forEach(roomCode => {
                    const info = directory[roomCode];
                    const div = document.createElement('div');
                    div.className = "p-3 bg-slate-950 border border-slate-850 rounded-xl flex justify-between items-center hover:border-indigo-500 transition-all";
                    div.innerHTML = `
                        <div>
                            <span class="font-mono text-sm font-bold text-white">${roomCode}</span>
                            <span class="text-[10px] bg-indigo-950 text-indigo-400 font-bold px-1.5 py-0.5 rounded ml-2 uppercase">${info.phase}</span>
                        </div>
                        <div class="flex gap-2">
                            <button class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1 text-xs font-bold rounded-lg text-white" onclick="window.directJoin('${roomCode}', 'player')">Play</button>
                            <button class="bg-slate-800 hover:bg-slate-700 px-3 py-1 text-xs font-bold rounded-lg text-slate-300" onclick="window.directJoin('${roomCode}', 'audience')">Watch</button>
                        </div>
                    `;
                    elements.activeGamesList.appendChild(div);
                });
            });
        }

        window.directJoin = (roomCode, role) => connectToRoom(roomCode, role);

        function connectToRoom(roomCode, role) {
            currentRoom = "room_" + roomCode;
            userRole = role;
            elements.displayRoomCode.innerText = `ROOM: ${roomCode}`;

            const roomRef = ref(db, currentRoom);
            runTransaction(roomRef, (currentData) => {
                if (!currentData) {
                    isHost = true; 
                    return {
                        roomCode: roomCode,
                        hostId: userId,
                        phase: "LOBBY",
                        users: {},
                        currentPrompt: "",
                        promptWriter: "",
                        answerWriters: [],
                        answers: {},
                        votes: {},
                        chat: {}
                    };
                }
                return currentData;
            }).then(() => {
                // Register in public directory index
                set(ref(db, `game_directory/${roomCode}`), { phase: "LOBBY" });

                if (isHost) elements.hostControls.classList.remove('hidden');

                set(ref(db, `${currentRoom}/users/${userId}`), {
                    id: userId,
                    name: userName,
                    role: role,
                    score: 0
                }).then(() => {
                    screens.room.classList.add('hidden');
                    screens.game.classList.remove('hidden');
                    listenToGameRoom();
                    listenToChat();
                });
            });
        }

        // Live Chat Routing
        elements.chatSendBtn.addEventListener('click', sendChatMessage);
        elements.chatInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendChatMessage(); });

        function sendChatMessage() {
            const text = elements.chatInput.value.trim();
            if(!text) return;
            const chatRef = ref(db, `${currentRoom}/chat/${Date.now()}`);
            set(chatRef, {
                sender: userName,
                text: cleanContent(text)
            });
            elements.chatInput.value = "";
        }

        function listenToChat() {
            onValue(ref(db, `${currentRoom}/chat`), (snapshot) => {
                const logs = snapshot.val();
                if(!logs) return;
                elements.chatBox.innerHTML = Object.values(logs).map(m => `
                    <div class="text-xs break-words">
                        <span class="font-bold text-indigo-400">${m.sender}:</span> 
                        <span class="text-slate-300">${m.text}</span>
                    </div>
                `).join('');
                elements.chatBox.scrollTop = elements.chatBox.scrollHeight;
            });
        }

        function listenToGameRoom() {
            onValue(ref(db, currentRoom), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                roomState = data;
                renderRoomState();
            });
        }

        function renderRoomState() {
            const usersList = roomState.users ? Object.values(roomState.users) : [];
            const players = usersList.filter(u => u.role === 'player');
            const audience = usersList.filter(u => u.role === 'audience');

            elements.totalCounter.innerText = `Capacity: ${usersList.length} / 1000`;
            elements.audienceCount.innerText = `${audience.length} Live`;

            elements.playerList.innerHTML = players.map(p => `
                <div class="p-2 bg-slate-800 border border-slate-700/40 rounded-lg flex justify-between items-center text-xs">
                    <span class="font-medium text-slate-100 flex items-center gap-1">
                        ${p.name} ${p.id === userId ? '<b class="text-emerald-400 text-[9px]">[YOU]</b>':''}
                    </span>
                    <span class="bg-slate-900 px-2 py-0.5 rounded text-slate-400 font-mono">Pts: ${p.score || 0}</span>
                </div>
            `).join('');

            if(isHost) {
                elements.startBtn.disabled = players.length < 1;
                elements.startBtn.classList.toggle('opacity-40', players.length < 1);
            }

            switch(roomState.phase) {
                case "LOBBY":
                    elements.phaseContainer.innerHTML = `<div class="text-center py-10 bg-slate-900/60 rounded-xl border border-slate-800"><h2 class="text-lg font-bold text-indigo-400 animate-pulse">Waiting in Lobby...</h2><p class="text-xs text-slate-500 mt-1">Host will initiate match routing shortly.</p></div>`;
                    break;
                case "PROMPT_PHASE": renderPromptPhase(); break;
                case "ANSWER_PHASE": renderAnswerPhase(); break;
                case "VOTING_PHASE": renderVotingPhase(players, audience); break;
                case "RESULTS_PHASE": renderResultsPhase(players); break;
            }
        }

        elements.startBtn.addEventListener('click', advanceToPromptPhase);

        function advanceToPromptPhase() {
            const players = Object.values(roomState.users || {}).filter(u => u.role === 'player');
            const targetWriter = players[Math.floor(Math.random() * players.length)].id;
            
            update(ref(db, `game_directory/${roomState.roomCode}`), { phase: "PROMPT" });
            update(ref(db, currentRoom), {
                phase: "PROMPT_PHASE",
                promptWriter: targetWriter,
                currentPrompt: "", answers: null, votes: null
            });
        }

        function renderPromptPhase() {
            const isWriter = roomState.promptWriter === userId;
            if (isWriter) {
                elements.phaseContainer.innerHTML = `
                    <div class="bg-slate-900 border border-amber-500/20 p-5 rounded-xl">
                        <h3 class="text-sm font-bold text-amber-400 mb-3">Write the Game Question Prompt:</h3>
                        <input type="text" id="prompt-input" placeholder="e.g., Worst way to spell Mississippi" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white text-xs mb-3 focus:outline-none focus:border-amber-500">
                        <button id="submit-prompt-btn" class="w-full bg-amber-500 text-slate-950 text-xs font-bold py-2 rounded-lg">Broadcast Prompt</button>
                    </div>
                `;
                document.getElementById('submit-prompt-btn').addEventListener('click', () => {
                    const val = cleanContent(document.getElementById('prompt-input').value.trim());
                    if (!val) return;
                    const players = Object.values(roomState.users).filter(u => u.role === 'player');
                    let candidates = players.filter(p => p.id !== userId);
                    if (candidates.length < 2) candidates = players;
                    const answerers = candidates.sort(() => 0.5 - Math.random()).slice(0, 2).map(c => c.id);

                    update(ref(db, currentRoom), { currentPrompt: val, answerWriters: answerers, phase: "ANSWER_PHASE" });
                });
            } else {
                elements.phaseContainer.innerHTML = `<div class="text-center py-12 bg-slate-900/40 rounded-xl"><p class="text-xs text-slate-400">Someone is thinking up a wild prompt question...</p></div>`;
            }
        }

        function renderAnswerPhase() {
            if (roomState.answerWriters?.includes(userId)) {
                if (roomState.answers?.[userId]) {
                    elements.phaseContainer.innerHTML = `<div class="text-center py-12 bg-slate-900 rounded-xl"><p class="text-xs text-emerald-400 font-bold">Answer tracking locked in!</p></div>`;
                    return;
                }
                elements.phaseContainer.innerHTML = `
                    <div class="bg-slate-900 border border-indigo-500/20 p-5 rounded-xl">
                        <span class="text-[10px] text-indigo-400 font-bold block mb-1">PROMPT:</span>
                        <h3 class="text-base font-black text-white mb-4">"${roomState.currentPrompt}"</h3>
                        <input type="text" id="answer-input" placeholder="Your funny answer..." class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white text-xs mb-3 focus:outline-none">
                        <button id="submit-answer-btn" class="w-full bg-indigo-600 text-white text-xs font-bold py-2 rounded-lg">Submit Answer</button>
                    </div>
                `;
                document.getElementById('submit-answer-btn').addEventListener('click', () => {
                    const txt = cleanContent(document.getElementById('answer-input').value.trim());
                    if (!txt) return;
                    set(ref(db, `${currentRoom}/answers/${userId}`), { userId: userId, text: txt }).then(() => {
                        runTransaction(ref(db, currentRoom), (c) => {
                            if (c && Object.keys(c.answers || {}).length >= (c.answerWriters?.length || 2)) c.phase = "VOTING_PHASE";
                            return c;
                        });
                    });
                });
            } else {
                elements.phaseContainer.innerHTML = `<div class="text-center py-12 bg-slate-900/40 rounded-xl"><p class="text-xs text-slate-400">Contestants are fighting over answers to: <br><b class="text-slate-200">"${roomState.currentPrompt}"</b></p></div>`;
            }
        }

        function renderVotingPhase(players, audience) {
            if (roomState.answerWriters?.includes(userId)) {
                elements.phaseContainer.innerHTML = `<div class="text-center py-12 bg-slate-900 rounded-xl"><p class="text-xs text-amber-400 font-bold">Your prompt choice is on display. Abstaining from voting.</p></div>`;
                return;
            }
            if (roomState.votes?.[userId]) {
                elements.phaseContainer.innerHTML = `<div class="text-center py-12 bg-slate-900 rounded-xl"><p class="text-xs text-slate-500">Vote registered!</p></div>`;
                return;
            }

            elements.phaseContainer.innerHTML = `
                <div class="bg-slate-900 border border-pink-500/20 p-5 rounded-xl">
                    <h3 class="text-center font-bold text-sm text-white mb-4">"${roomState.currentPrompt}"</h3>
                    <div class="space-y-2" id="opts"></div>
                </div>
            `;
            const box = document.getElementById('opts');
            Object.values(roomState.answers || {}).forEach(ans => {
                const b = document.createElement('button');
                b.className = "w-full text-left p-3 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white hover:border-pink-500 transition-all";
                b.innerText = ans.text;
                b.addEventListener('click', () => {
                    set(ref(db, `${currentRoom}/votes/${userId}`), ans.userId).then(() => {
                        runTransaction(ref(db, currentRoom), (c) => {
                            const totalVoters = (players.length + audience.length) - (c.answerWriters?.length || 2);
                            if (c && Object.keys(c.votes || {}).length >= Math.max(1, totalVoters)) c.phase = "RESULTS_PHASE";
                            return c;
                        });
                    });
                });
                box.appendChild(b);
            });
        }

        function renderResultsPhase(players) {
            const answers = Object.values(roomState.answers || {});
            const tallies = {};
            answers.forEach(a => tallies[a.userId] = 0);
            Object.values(roomState.votes || {}).forEach(tid => { if(tallies[tid] !== undefined) tallies[tid]++; });

            const winnerId = answers[0] && (tallies[answers[0].userId] >= (tallies[answers[1]?.userId] || 0)) ? answers[0].userId : answers[1]?.userId;
            const winName = roomState.users[winnerId]?.name || "Anonymous";

            elements.phaseContainer.innerHTML = `
                <div class="bg-slate-900 border border-emerald-500/20 p-5 rounded-xl text-center text-xs">
                    <h3 class="font-bold text-slate-400 mb-4">"${roomState.currentPrompt}"</h3>
                    <div class="space-y-2 mb-4">${answers.map(a => `
                        <div class="p-3 bg-slate-950 border border-slate-850 rounded-lg flex justify-between items-center">
                            <div><b class="text-slate-500">${roomState.users[a.userId]?.name || 'Player'}:</b> "${a.text}"</div>
                            <div class="font-bold text-indigo-400">${tallies[a.userId] || 0} Volatile Votes</div>
                        </div>
                    `).join('')}</div>
                    <div class="bg-emerald-950/20 border border-emerald-500/30 p-2.5 rounded-lg mb-4 text-emerald-400 font-bold">Winner: ${winName}</div>
                    ${isHost ? `<button id="end-or-next-btn" class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded-lg mb-2">Next Round</button><button id="destroy-btn" class="w-full bg-rose-950 text-rose-400 border border-rose-900 py-2 rounded-lg font-bold">Close Game (Remove from Index)</button>` : `<p class="text-slate-500 italic">Awaiting room host administration choice...</p>`}
                </div>
            `;

            if(isHost) {
                document.getElementById('end-or-next-btn').addEventListener('click', () => {
                    runTransaction(ref(db, `${currentRoom}/users/${winnerId}/score`), (s) => (s || 0) + 100).then(() => {
                        update(ref(db, currentRoom), { phase: "PROMPT_PHASE", currentPrompt: "", answers: null, votes: null });
                    });
                });
                document.getElementById('destroy-btn').addEventListener('click', () => {
                    remove(ref(db, `game_directory/${roomState.roomCode}`)).then(() => {
                        remove(ref(db, currentRoom)).then(() => { location.reload(); });
                    });
                });
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <header class="border-b border-slate-900 bg-slate-900/40 backdrop-blur px-4 py-3">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xs font-black tracking-widest text-white">
                GAME <span id="display-room-code" class="text-slate-500 bg-slate-900 px-2 py-0.5 rounded ml-1 font-mono text-[10px]">DIRECTORY</span>
            </h1>
            <div id="total-counter" class="text-[10px] bg-slate-900 border border-slate-800 text-slate-400 px-3 py-1 rounded-full font-mono">0 / 1000 Capacity</div>
        </div>
    </header>

    <main class="max-w-5xl w-full mx-auto p-4 flex-grow flex items-center justify-center">
        
        <section id="screen-username" class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-base font-bold text-white mb-1">Pick a Nickname</h2>
            <p class="text-slate-400 text-xs mb-4">No registration or passwords required.</p>
            <input type="text" id="username-input" placeholder="Enter handle..." class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none mb-3">
            <button id="next-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider">Continue</button>
        </section>

        <section id="screen-room" class="hidden w-full max-w-md grid grid-cols-1 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                <h2 class="text-sm font-bold text-white mb-3">Create/Join Private Key</h2>
                <input type="text" id="room-input" placeholder="e.g., LOBBY7" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-center font-mono uppercase tracking-widest font-bold mb-3 text-sm focus:outline-none">
                <div class="grid grid-cols-2 gap-2">
                    <button id="create-room-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs">Join/Host Player</button>
                    <button id="join-audience-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs">Join Audience</button>
                </div>
            </div>
            
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Currently Active Game Matches</h3>
                <div id="active-games-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </div>
        </section>

        <section id="screen-game" class="hidden w-full grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
            <div class="md:col-span-1 space-y-3">
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Players (Max 20)</h3>
                    <div id="player-list" class="space-y-1.5 max-h-36 overflow-y-auto"></div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                    <span class="text-slate-400 uppercase font-bold text-[10px]">Audience Seats</span>
                    <span id="audience-count" class="font-bold font-mono text-indigo-400">0</span>
                </div>
                <div id="host-controls" class="hidden bg-slate-900 border border-amber-500/20 p-3 rounded-xl">
                    <button id="start-btn" disabled class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded-lg text-xs tracking-wider uppercase">Advance Phase</button>
                </div>
            </div>

            <div class="md:col-span-2 bg-slate-900/40 p-1 rounded-xl">
                <div id="phase-container" class="w-full"></div>
            </div>

            <div class="md:col-span-1 bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col h-72 justify-between">
                <h4 class="text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-1.5 border-b border-slate-800 pb-1">Room Chat</h4>
                <div id="chat-box" class="flex-grow overflow-y-auto space-y-1.5 pr-1 py-1 mb-2"></div>
                <div class="flex gap-1.5">
                    <input type="text" id="chat-input" placeholder="Type..." class="flex-grow bg-slate-950 border border-slate-850 rounded-lg text-xs p-1.5 text-white focus:outline-none">
                    <button id="chat-send-btn" class="bg-indigo-600 px-2.5 rounded-lg text-[10px] font-bold">Send</button>
                </div>
            </div>
        </section>

    </main>

    <footer class="text-center py-2 text-[9px] text-slate-700 font-mono border-t border-slate-900">Quiplash but Not V0.6</footer>
</body>
</html>
