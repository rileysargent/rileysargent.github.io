<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilded | Secure Auth</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-deep: #0e1113;
            --bg-side: #1e2327;
            --bg-chat: #313338;
            --bg-members: #2b2d31;
            --accent: #5865f2;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --danger: #fa777c;
            --success: #23a559;
            --gold: #f1c40f;
            --voice: #43b581;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Segoe UI', sans-serif; }
        body { background: var(--bg-deep); height: 100vh; display: flex; color: var(--text-main); overflow: hidden; }

        /* Auth Gate */
        #auth-screen { position: fixed; inset: 0; background: #111214; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: #2b2d31; padding: 32px; border-radius: 8px; width: 440px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        .auth-card h2 { text-align: center; color: white; margin-bottom: 8px; }
        .auth-card p { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        
        .label { color: var(--text-muted); font-size: 12px; font-weight: 800; margin-bottom: 8px; display: block; text-transform: uppercase; }
        .input-box { width: 100%; padding: 12px; background: #1e1f22; border: none; color: white; border-radius: 4px; margin-bottom: 20px; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .btn-primary:hover { background: #4752c4; }

        .auth-footer { margin-top: 16px; font-size: 14px; color: var(--text-muted); }
        .auth-link { color: var(--accent); cursor: pointer; text-decoration: none; }
        .auth-link:hover { text-decoration: underline; }

        /* Navigation & Layout */
        #nav-rail { width: 72px; background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; flex-shrink: 0; }
        .guild-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-side); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; position: relative; }
        .guild-icon:hover, .guild-icon.active { border-radius: 15px; background: var(--accent); }
        .guild-icon.active::before { content: ""; position: absolute; left: -12px; height: 40px; width: 4px; background: white; border-radius: 4px; }

        #sidebar { width: 240px; background: var(--bg-side); display: flex; flex-direction: column; flex-shrink: 0; }
        #chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); border-right: 1px solid rgba(255,255,255,0.05); }
        #member-sidebar { width: 240px; background: var(--bg-members); display: flex; flex-direction: column; padding: 10px; flex-shrink: 0; }

        .msg-row { display: flex; gap: 16px; margin-bottom: 16px; padding: 4px 16px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #444; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .badge { font-size: 9px; padding: 2px 4px; border-radius: 3px; color: white; text-transform: uppercase; margin-left: 5px; }
        .badge-owner { background: var(--gold); color: black; font-weight: 800; }
        
        #input-zone { padding: 0 16px 24px; }
        #msg-input { width: 100%; padding: 11px; background: #383a40; border: none; border-radius: 8px; color: white; outline: none; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card" id="login-panel">
        <h2>Welcome back!</h2>
        <p>We're so excited to see you again!</p>
        
        <span class="label">Email</span>
        <input type="email" id="login-email" class="input-box">
        
        <span class="label">Password</span>
        <input type="password" id="login-pass" class="input-box">
        
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px; font-size:14px; color:var(--text-muted);">
            <input type="checkbox" id="login-remember"> <label for="login-remember">Remember Me</label>
        </div>
        
        <button class="btn-primary" onclick="app.login()">Log In</button>
        
        <div class="auth-footer">
            Don't have an account? <span class="auth-link" onclick="app.showAuth('register')">Register</span>
        </div>
    </div>

    <div class="auth-card hidden" id="register-panel">
        <h2>Create an account</h2>
        <p>Join the Guilded community today!</p>
        
        <span class="label">Email</span>
        <input type="email" id="reg-email" class="input-box">
        
        <span class="label">Username</span>
        <input type="text" id="reg-nick" class="input-box">
        
        <span class="label">Password</span>
        <input type="password" id="reg-pass" class="input-box">
        
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px; font-size:14px; color:var(--text-muted);">
            <input type="checkbox" id="reg-remember"> <label for="reg-remember">Remember Me</label>
        </div>
        
        <button class="btn-primary" onclick="app.register()">Continue</button>
        
        <div class="auth-footer">
            <span class="auth-link" onclick="app.showAuth('login')">Already have an account?</span>
        </div>
    </div>
</div>

<nav id="nav-rail">
    <div class="guild-icon active" onclick="app.viewDMs()">G</div>
    <div style="width:32px; height:2px; background:#333; margin:4px 0;"></div>
    <div id="guild-list"></div>
    <div class="guild-icon" style="color:var(--success)" onclick="app.createServer()">+</div>
</nav>

<aside id="sidebar">
    <div class="side-header" style="height: 48px; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.2); font-weight: 700;">
        <span id="sidebar-title">Guilded</span>
    </div>
    <div style="flex:1; overflow-y:auto; padding:8px;" id="channel-list"></div>
    <div style="padding:10px; background:rgba(0,0,0,0.3); display:flex; align-items:center; gap:10px;">
        <div class="avatar" style="width:32px; height:32px; font-size:12px;" id="my-avatar">?</div>
        <div style="flex:1; font-size:13px; font-weight:600;" id="my-name">...</div>
        <div style="cursor:pointer; opacity:0.6;" onclick="app.logout()">🚪</div>
    </div>
</aside>

<main id="chat-main">
    <div id="chat-header" style="height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(0,0,0,0.2); font-weight: 600;"># channel</div>
    <div id="message-area"></div>
    <div id="input-zone">
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
    </div>
</main>

<aside id="member-sidebar">
    <div id="list-admins"></div>
    <div id="list-users"></div>
</aside>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
        authDomain: "hyperspace-r.firebaseapp.com",
        databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hyperspace-r",
        storageBucket: "hyperspace-r.firebasestorage.app",
        messagingSenderId: "1050495683444",
        appId: "1:1050495683444:web:846c42d274197b20313a21"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const ADMIN_LIST = ["rileysargent2@gmail.com", "guildedsec@gmail.com"];

    const app = {
        me: null,
        activePath: null,

        showAuth(type) {
            document.getElementById('login-panel').classList.toggle('hidden', type === 'register');
            document.getElementById('register-panel').classList.toggle('hidden', type === 'login');
        },

        async login() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const remember = document.getElementById('login-remember').checked;
            const persist = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;

            try {
                await auth.setPersistence(persist);
                await auth.signInWithEmailAndPassword(email, pass);
            } catch(e) { alert(e.message); }
        },

        async register() {
            const email = document.getElementById('reg-email').value;
            const nick = document.getElementById('reg-nick').value;
            const pass = document.getElementById('reg-pass').value;
            const remember = document.getElementById('reg-remember').checked;
            const persist = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;

            if(!nick) return alert("Please enter a username.");

            try {
                await auth.setPersistence(persist);
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                await db.ref(`users/${res.user.uid}`).set({
                    uid: res.user.uid,
                    name: nick,
                    email: email.toLowerCase()
                });
            } catch(e) { alert(e.message); }
        },

        init() {
            auth.onAuthStateChanged(u => {
                if(u) {
                    db.ref(`users/${u.uid}`).on('value', snap => {
                        this.me = snap.val();
                        if(!this.me) return;
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('my-name').innerText = this.me.name;
                        document.getElementById('my-avatar').innerText = this.me.name[0];
                        this.loadGuilds();
                        this.viewDMs();
                    });
                } else {
                    document.getElementById('auth-screen').style.display = 'flex';
                }
            });
        },

        loadGuilds() {
            db.ref('servers').on('value', snap => {
                const rail = document.getElementById('guild-list');
                rail.innerHTML = '';
                snap.forEach(s => {
                    const icon = document.createElement('div');
                    icon.className = 'guild-icon';
                    icon.innerText = s.val().name[0];
                    icon.onclick = () => this.viewServer(s.key, s.val());
                    rail.appendChild(icon);
                });
            });
        },

        viewServer(id, data) {
            document.getElementById('sidebar-title').innerText = data.name;
            const list = document.getElementById('channel-list');
            list.innerHTML = `<div class="nav-btn" onclick="app.openChat('servers/${id}/gen', 'general')" style="cursor:pointer; padding:8px; color:var(--text-muted);"># general</div>`;
        },

        viewDMs() {
            document.getElementById('sidebar-title').innerText = "Direct Messages";
            const list = document.getElementById('channel-list');
            list.innerHTML = '';
            db.ref('users').once('value', snap => {
                snap.forEach(u => {
                    if(u.key === this.me?.uid) return;
                    const d = u.val();
                    const btn = document.createElement('div');
                    btn.innerHTML = `@ ${d.name}`;
                    btn.style.padding = "8px";
                    btn.style.cursor = "pointer";
                    btn.onclick = () => {
                        const room = this.me.uid < u.key ? `${this.me.uid}_${u.key}` : `${u.key}_${this.me.uid}`;
                        this.openChat(`dms/${room}`, d.name);
                    };
                    list.appendChild(btn);
                });
            });
        },

        openChat(path, name) {
            this.activePath = path;
            document.getElementById('chat-header').innerText = `# ${name}`;
            const area = document.getElementById('message-area');
            area.innerHTML = '';
            db.ref(`${path}/messages`).off();
            db.ref(`${path}/messages`).limitToLast(50).on('child_added', snap => {
                const m = snap.val();
                const isAdmin = ADMIN_LIST.includes(m.email.toLowerCase());
                const row = document.createElement('div');
                row.className = 'msg-row';
                row.innerHTML = `
                    <div class="avatar" style="background:${isAdmin ? 'var(--gold)' : '#444'}; color:${isAdmin ? 'black' : 'white'}">${m.name[0]}</div>
                    <div class="msg-info">
                        <div style="font-weight:600; color:${isAdmin ? 'var(--gold)' : 'inherit'}">${m.name} ${isAdmin ? '<span class="badge badge-owner">Owner</span>' : ''}</div>
                        <div>${m.text}</div>
                    </div>
                `;
                area.appendChild(row);
                area.scrollTop = area.scrollHeight;
            });
        },

        send() {
            const input = document.getElementById('msg-input');
            if(!input.value.trim() || !this.activePath) return;
            db.ref(`${this.activePath}/messages`).push({
                uid: this.me.uid, name: this.me.name, email: this.me.email,
                text: input.value, time: Date.now()
            });
            input.value = '';
        },

        createServer() {
            const n = prompt("Server Name:");
            if(n) db.ref('servers').push({ name: n, owner: this.me.uid });
        },

        logout() { auth.signOut(); location.reload(); }
    };

    app.init();
    document.getElementById('msg-input').onkeypress = e => { if(e.key === 'Enter') app.send(); };
</script>
</body>
</html>
