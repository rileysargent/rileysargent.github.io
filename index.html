<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotForge</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<style>
/* ---------------- GENERAL ---------------- */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #f5f5f5;
    color: #1c1c1c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ---------------- HEADER ---------------- */
h1 {
    text-align: center;
    font-size: 2rem;
    padding: 20px 0;
    background-color: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    position: sticky;
    top: 0;
    z-index: 100;
}

/* ---------------- MAIN CONTAINER ---------------- */
main {
    display: flex;
    flex-direction: row;
    flex: 1;
    gap: 20px;
    padding: 20px;
}

/* ---------------- SIDEBAR ---------------- */
aside {
    width: 250px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    height: calc(100vh - 80px);
    overflow-y: auto;
}

/* Sidebar sections */
aside h2 {
    font-size: 1.2rem;
    border-bottom: 1px solid #ddd;
    padding-bottom: 5px;
    margin-bottom: 10px;
}

/* ---------------- CONTENT AREA ---------------- */
section {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* ---------------- INPUTS & BUTTONS ---------------- */
input, textarea, button {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    width: 100%;
}

input:focus, textarea:focus {
    outline: none;
    border-color: #4a90e2;
    box-shadow: 0 0 5px rgba(74,144,226,0.3);
}

button {
    background-color: #4a90e2;
    color: #fff;
    border: none;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background-color: #357ABD;
}

button:active {
    transform: scale(0.98);
}

/* ---------------- CREATE BOT & DISCOVER ---------------- */
.bot-card, .favorite-card {
    background-color: #fff;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
}

.bot-card b {
    font-size: 1.1rem;
}

.bot-card button {
    width: auto;
    margin-right: 5px;
}

/* Discover grid */
#botList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

/* Favorites list */
#favorites {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* ---------------- CHAT ---------------- */
#chatBox {
    flex: 1;
    background: #fff;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    max-height: 400px;
    border: 1px solid #ddd;
}

/* Chat bubbles */
#chatBox div {
    padding: 10px 15px;
    border-radius: 20px;
    max-width: 75%;
    word-wrap: break-word;
    position: relative;
    display: inline-block;
}

#chatBox div.user {
    background-color: #4a90e2;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 0;
}

#chatBox div.bot {
    background-color: #f0f0f0;
    align-self: flex-start;
    border-bottom-left-radius: 0;
}

/* Chat timestamp */
#chatBox div span.timestamp {
    font-size: 0.7rem;
    color: #666;
    position: absolute;
    bottom: -15px;
    right: 10px;
}

/* Chat input area */
#chatInput {
    border-radius: 20px;
    padding: 10px 15px;
    margin-top: 10px;
}

#chatInput + button {
    margin-top: 5px;
    width: 100px;
    align-self: flex-end;
}

/* ---------------- FORMS ---------------- */
textarea {
    resize: vertical;
}

/* ---------------- RESPONSIVE ---------------- */
@media (max-width: 1024px) {
    main {
        flex-direction: column;
    }

    aside {
        width: 100%;
        height: auto;
    }
}

@media (max-width: 600px) {
    #chatBox {
        max-height: 250px;
    }
}
</style>
</head>

<body>
<div class="container">

<h1>BotForge</h1>

<!-- AUTH -->
<div class="section auth-group">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>
</div>

<!-- STATS -->
<div class="section">
<h2>Stats</h2>
<div id="stats"></div>
</div>

<!-- CREATE BOT -->
<div class="section">
<h2>Create Bot</h2>
<input id="botName" placeholder="Name">
<input id="botImage" placeholder="Image URL">
<textarea id="botDescription" placeholder="Description"></textarea>
<textarea id="botLore" placeholder="Lore"></textarea>
<textarea id="botPrompt" placeholder="Prompt"></textarea>
<button onclick="createBot()">Create Bot</button>
</div>

<!-- DISCOVER -->
<div class="section">
<h2>Discover</h2>
<div id="botList"></div>
</div>

<!-- CHAT -->
<div class="section">
<h2>Chat</h2>
<div id="chatContainer">
    <div id="chatBox"></div>
    <div class="chat-input">
        <input id="chatInput" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>
</div>

<!-- FAVORITES -->
<div class="section">
<h2>Favorites</h2>
<div id="favorites"></div>
</div>

</div>

<script>
const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentBot = null;

/* AUTH */
function signup(){ auth.createUserWithEmailAndPassword(email.value,password.value); }
function login(){ auth.signInWithEmailAndPassword(email.value,password.value); }
function logout(){ auth.signOut(); }

/* USER INIT */
function initUser(uid){
    db.collection("users").doc(uid).set({
        messages: 0,
        botsUsed: [],
        favorites: []
    },{merge:true});
}

/* CREATE BOT */
function createBot(){
    const user=auth.currentUser;
    if(!user) return;
    db.collection("bots").add({
        name: botName.value,
        image: botImage.value,
        description: botDescription.value,
        lore: botLore.value,
        prompt: botPrompt.value,
        creator: user.uid,
        createdAt: Date.now()
    });
}

/* LOAD BOTS */
function loadBots(){
    botList.innerHTML="";
    db.collection("bots").get().then(snap=>{
        snap.forEach(doc=>{
            const b=doc.data();
            const div=document.createElement("div");
            div.className="bot-card";
            div.innerHTML=`
                <div>
                    <b>${b.name}</b>
                    <p>${b.description}</p>
                </div>
                <div>
                    <button onclick="selectBot('${doc.id}')">Chat</button>
                    <button onclick="favoriteBot('${doc.id}')">⭐</button>
                </div>
            `;
            botList.appendChild(div);
        });
    });
}

/* SELECT BOT */
function selectBot(id){
    db.collection("bots").doc(id).get().then(doc=>{
        currentBot = {id, ...doc.data()};
        chatBox.innerHTML="";
    });
}

/* CALL BACKEND */
async function callAI(message, bot){
    const res = await fetch("https://YOUR-RENDER-URL/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ message, bot })
    });
    const data = await res.json();
    return data.reply;
}

/* SEND MESSAGE */
async function sendMessage(){
    const user=auth.currentUser;
    if(!user || !currentBot) return;

    chatBox.innerHTML += `<div class="chat-message user">You: ${chatInput.value}</div>`;
    chatBox.innerHTML += `<div class="chat-message bot">Waiting in queue...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    const reply = await callAI(chatInput.value,currentBot);

    // Remove waiting message
    const wait = chatBox.querySelector(".chat-message.bot:last-child");
    if(wait) wait.remove();

    chatBox.innerHTML += `<div class="chat-message bot">${reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    chatInput.value="";

    const ref=db.collection("users").doc(user.uid);
    const doc=await ref.get();
    let bots=doc.data().botsUsed||[];
    if(!bots.includes(currentBot.id)) bots.push(currentBot.id);
    await ref.update({ messages:(doc.data().messages||0)+1, botsUsed:bots });

    loadStats();
}

/* FAVORITES */
function favoriteBot(id){
    const user=auth.currentUser;
    if(!user) return;
    const ref=db.collection("users").doc(user.uid);
    ref.get().then(doc=>{
        let fav=doc.data().favorites||[];
        if(!fav.includes(id)) fav.push(id);
        ref.update({favorites:fav});
        loadFavorites();
    });
}

/* LOAD FAVORITES */
function loadFavorites(){
    const user=auth.currentUser;
    if(!user) return;
    db.collection("users").doc(user.uid).get().then(doc=>{
        favorites.innerHTML="";
        const favs=doc.data().favorites||[];
        favs.forEach(id=>{
            db.collection("bots").doc(id).get().then(b=>{
                const div=document.createElement("div");
                div.className="favorite-card";
                div.textContent=b.data().name;
                favorites.appendChild(div);
            });
        });
    });
}

/* STATS */
function loadStats(){
    const user=auth.currentUser;
    if(!user) return;
    db.collection("users").doc(user.uid).get().then(doc=>{
        const d=doc.data();
        stats.innerHTML=`Messages: ${d.messages||0}<br>Bots Used: ${(d.botsUsed||[]).length}`;
    });
}

/* INIT */
auth.onAuthStateChanged(user=>{
    if(user){
        initUser(user.uid);
        loadBots();
        loadStats();
        loadFavorites();
    }
});
</script>
</body>
</html>
