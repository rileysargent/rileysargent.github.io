<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Hyperspace-R Deep Audit</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #auth-overlay { position: fixed; inset: 0; background: #111; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 5px solid #333; }
        #admin-panel { display: none; position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.9); border: 2px solid #0f0; padding: 15px; z-index: 5000; box-shadow: 0 0 10px #0f0; }
        #game-wrapper { display: none; width: 100vw; height: 100vh; }
        button { background: #0f0; color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px; width: 120px; margin-bottom: 10px; }
        .terminal-text { font-size: 12px; color: #0a0; margin-bottom: 20px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, setPersistence, browserSessionPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
            authDomain: "hyperspace-r.firebaseapp.com",
            databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "hyperspace-r",
            storageBucket: "hyperspace-r.firebasestorage.app",
            messagingSenderId: "1050495683444",
            appId: "1:1050495683444:web:846c42d274197b20313a21",
            measurementId: "G-8RC2TB95T7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        let gameInstance = null;
        let currentUser = null;

        // --- 1. GLOBAL INTERCEPTOR (RAW CONSOLE LOGGING) ---
        // Overrides LocalStorage to show EXACT data in console
        const originalSet = localStorage.setItem;
        localStorage.setItem = function(key, value) {
            console.log(`%c[STORAGE_WRITE] %cKey: "${key}" %cValue:`, "color: #0f0", "color: #fff", "color: #0ff", value);
            originalSet.apply(this, arguments);
        };

        // --- 2. INDEXED_DB SCANNER ---
        window.dumpIndexedDB = async function() {
            if (currentUser !== "rileysargent2@gmail.com") return;
            const dbs = await window.indexedDB.databases();
            console.log("%c--- INDEXED_DB DUMP ---", "color: #f0f; font-weight: bold;");
            dbs.forEach(dbInfo => {
                const req = window.indexedDB.open(dbInfo.name);
                req.onsuccess = (e) => {
                    const db = e.target.result;
                    Array.from(db.objectStoreNames).forEach(s => {
                        db.transaction(s, "readonly").objectStore(s).getAll().onsuccess = (ev) => {
                            console.log(`%cDB: ${db.name} | Store: ${s}`, "color: #ff0", ev.target.result);
                        };
                    });
                };
            });
        };

        // --- 3. DYNAMIC LOADER (NO LOAD UNTIL LOGIN) ---
        async function bootEngine() {
            console.log("%cInitializing Game Engine...", "color: #0f0");
            const loadScript = (src) => new Promise(res => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = res;
                document.head.appendChild(s);
            });

            await loadScript("TemplateData/UnityProgress.js");
            await loadScript("Build/UnityLoader.js");

            gameInstance = UnityLoader.instantiate("gameContainer", "Build/SnowRider3D-gd-1.json", {
                onProgress: UnityProgress,
                Module: { onRuntimeInitialized: () => console.log("%cENGINE_LOADED: Ready for injection.", "color: #0f0") }
            });
        }

        // --- 4. AUTH LOGIC & SECURITY ---
        onAuthStateChanged(auth, (user) => {
            const adminPanel = document.getElementById('admin-panel');
            const overlay = document.getElementById('auth-overlay');
            const wrapper = document.getElementById('game-wrapper');

            if (user && user.email === "rileysargent2@gmail.com") {
                currentUser = user.email;
                overlay.style.display = 'none';
                wrapper.style.display = 'block';
                bootEngine(); 
            } else if (user) {
                signOut(auth).then(() => { alert("UNAUTHORIZED"); location.reload(); });
            } else {
                overlay.style.display = 'flex';
                wrapper.style.display = 'none';
                adminPanel.style.display = 'none';
            }
        });

        // --- 5. HOTKEYS & CHEATS ---
        window.addEventListener('keydown', (e) => {
            if (currentUser !== "rileysargent2@gmail.com") return;
            
            if (e.key === '&') {
                const p = document.getElementById('admin-panel');
                p.style.display = (p.style.display === 'none') ? 'block' : 'none';
                window.dumpIndexedDB();
            }
            if (e.key === '`') {
                const logs = JSON.parse(localStorage.getItem('game_logs') || "[]");
                const blob = new Blob([logs.join('\n')], {type: 'text/plain'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'log.txt';
                a.click();
            }
        });

        window.injectCheat = () => {
            const val = document.getElementById('cheatScore').value;
            console.log(`%c[CHEAT] Overriding HighScore with: ${val}`, "color: red");
            gameInstance.SendMessage('GameManager', 'SetScore', parseInt(val));
            localStorage.setItem('HighScore', val);
        };

        document.getElementById('login-btn').onclick = () => {
            setPersistence(auth, browserSessionPersistence).then(() => signInWithPopup(auth, provider));
        };
    </script>
</head>
<body>
    <div id="auth-overlay">
        <div class="terminal-text">SYS_STATUS: LOCKED // REQUIRES_AUTH</div>
        <button id="login-btn" style="width: 200px;">EXECUTE_LOGIN</button>
    </div>

    <div id="admin-panel">
        <div><b>ADMIN_CONSOLE_V5</b></div><br>
        NEW_VAL: <input type="number" id="cheatScore" value="99999"><br>
        <button onclick="injectCheat()">OVERRIDE_SAVE</button>
        <button onclick="dumpIndexedDB()">FORCE_IDB_DUMP</button>
        <div style="font-size: 9px; margin-top: 10px;">& TOGGLE | ` EXPORT</div>
    </div>

    <div id="game-wrapper"><div id="gameContainer" style="width: 100%; height: 100%;"></div></div>
</body>
</html>
