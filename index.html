<!DOCTYPE html>
<html>
<head>
    <title>BotForge</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
</head>
<body>

<h1>BotForge</h1>

<!-- AUTH -->
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<hr>

<h2>Stats</h2>
<div id="stats"></div>

<hr>

<h2>Create Bot</h2>
<input id="botName" placeholder="Name">
<input id="botImage" placeholder="Image URL">
<textarea id="botDescription" placeholder="Description"></textarea>
<textarea id="botLore" placeholder="Lore"></textarea>
<textarea id="botPrompt" placeholder="Prompt"></textarea>
<button onclick="createBot()">Create</button>

<hr>

<h2>Discover</h2>
<div id="botList"></div>

<hr>

<h2>Chat</h2>
<div id="chatBox"></div>
<input id="chatInput">
<button onclick="sendMessage()">Send</button>

<hr>

<h2>Favorites</h2>
<div id="favorites"></div>

<script>
const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentBot = null;

/* AUTH */
function signup(){ auth.createUserWithEmailAndPassword(email.value,password.value); }
function login(){ auth.signInWithEmailAndPassword(email.value,password.value); }
function logout(){ auth.signOut(); }

/* USER INIT */
function initUser(uid){
    db.collection("users").doc(uid).set({
        messages: 0,
        botsUsed: [],
        favorites: []
    },{merge:true});
}

/* CREATE BOT */
function createBot(){
    const user=auth.currentUser;
    if(!user) return;

    db.collection("bots").add({
        name: botName.value,
        image: botImage.value,
        description: botDescription.value,
        lore: botLore.value,
        prompt: botPrompt.value,
        creator: user.uid,
        createdAt: Date.now()
    });
}

/* LOAD BOTS */
function loadBots(){
    botList.innerHTML="";
    db.collection("bots").get().then(snap=>{
        snap.forEach(doc=>{
            const b=doc.data();

            const div=document.createElement("div");
            div.innerHTML=`
                <b>${b.name}</b>
                <p>${b.description}</p>
                <button onclick="selectBot('${doc.id}')">Chat</button>
                <button onclick="favoriteBot('${doc.id}')">⭐</button>
                <hr>
            `;
            botList.appendChild(div);
        });
    });
}

/* SELECT BOT */
function selectBot(id){
    db.collection("bots").doc(id).get().then(doc=>{
        currentBot = {id, ...doc.data()};
        chatBox.innerHTML="";
    });
}

/* CALL BACKEND */
async function callAI(message, bot){
    const res = await fetch("https://YOUR-RENDER-URL/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ message, bot })
    });

    const data = await res.json();
    return data.reply;
}

/* SEND MESSAGE */
async function sendMessage(){
    const user=auth.currentUser;
    if(!user || !currentBot) return;

    chatBox.innerHTML += "<div>You: "+chatInput.value+"</div>";
    chatBox.innerHTML += "<div>Waiting in queue...</div>";

    const reply = await callAI(chatInput.value,currentBot);

    chatBox.innerHTML += "<div>"+reply+"</div>";

    chatInput.value="";

    const ref=db.collection("users").doc(user.uid);
    const doc=await ref.get();
    const data=doc.data();

    let bots=data.botsUsed||[];
    if(!bots.includes(currentBot.id)) bots.push(currentBot.id);

    await ref.update({
        messages:(data.messages||0)+1,
        botsUsed:bots
    });

    loadStats();
}

/* FAVORITES */
function favoriteBot(id){
    const user=auth.currentUser;
    if(!user) return;

    const ref=db.collection("users").doc(user.uid);

    ref.get().then(doc=>{
        let fav=doc.data().favorites||[];
        if(!fav.includes(id)) fav.push(id);

        ref.update({favorites:fav});
        loadFavorites();
    });
}

/* LOAD FAVORITES */
function loadFavorites(){
    const user=auth.currentUser;
    if(!user) return;

    db.collection("users").doc(user.uid).get().then(doc=>{
        favorites.innerHTML="";
        const favs=doc.data().favorites||[];

        favs.forEach(id=>{
            db.collection("bots").doc(id).get().then(b=>{
                const div=document.createElement("div");
                div.textContent=b.data().name;
                favorites.appendChild(div);
            });
        });
    });
}

/* STATS */
function loadStats(){
    const user=auth.currentUser;
    if(!user) return;

    db.collection("users").doc(user.uid).get().then(doc=>{
        const d=doc.data();
        stats.innerHTML=`
            Messages: ${d.messages||0}<br>
            Bots Used: ${(d.botsUsed||[]).length}
        `;
    });
}

/* INIT */
auth.onAuthStateChanged(user=>{
    if(user){
        initUser(user.uid);
        loadBots();
        loadStats();
        loadFavorites();
    }
});
</script>

</body>
</html>
