<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilded | Ultimate + Voice</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-deep: #0e1113;
            --bg-side: #1e2327;
            --bg-chat: #313338;
            --bg-members: #2b2d31;
            --bg-modals: #2b2d31;
            --accent: #5865f2;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --danger: #fa777c;
            --success: #23a559;
            --gold: #f1c40f;
            --voice: #43b581;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Segoe UI', sans-serif; }
        body { background: var(--bg-deep); height: 100vh; display: flex; color: var(--text-main); overflow: hidden; }

        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: #111214; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--bg-modals); padding: 32px; border-radius: 8px; width: 440px; }
        .input-box { width: 100%; padding: 10px; background: #1e1f22; border: none; color: white; border-radius: 3px; margin-bottom: 20px; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .remember-wrap { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

        /* Navigation */
        #nav-rail { width: 72px; background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; flex-shrink: 0; }
        .guild-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-side); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; position: relative; overflow: hidden; }
        .guild-icon:hover, .guild-icon.active { border-radius: 15px; background: var(--accent); }
        .guild-icon.active::before { content: ""; position: absolute; left: -12px; height: 40px; width: 4px; background: white; border-radius: 4px; }

        #sidebar { width: 240px; background: var(--bg-side); display: flex; flex-direction: column; flex-shrink: 0; }
        .side-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; border-bottom: 1px solid rgba(0,0,0,0.2); }
        
        /* Chat area */
        #chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); border-right: 1px solid rgba(255,255,255,0.05); }
        #chat-header { height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(0,0,0,0.2); font-weight: 600; }
        #message-area { flex: 1; overflow-y: auto; padding: 20px; }
        
        /* Member List */
        #member-sidebar { width: 240px; background: var(--bg-members); display: flex; flex-direction: column; padding: 10px; flex-shrink: 0; }
        .member-group { font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 14px 8px 4px; text-transform: uppercase; }
        .member-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }

        /* Voice Controls */
        #voice-panel { background: #232428; padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.2); display: none; }
        .voice-user { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
        .voice-active-indicator { width: 8px; height: 8px; background: var(--voice); border-radius: 50%; box-shadow: 0 0 5px var(--voice); }

        .msg-row { display: flex; gap: 16px; margin-bottom: 16px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #444; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .badge { font-size: 9px; padding: 2px 4px; border-radius: 3px; color: white; text-transform: uppercase; margin-left: 5px; }
        .badge-owner { background: var(--gold); color: black; }

        #input-zone { padding: 0 16px 24px; }
        #msg-input { width: 100%; padding: 11px; background: #383a40; border: none; border-radius: 8px; color: white; outline: none; }

        .nav-btn { width: 100%; padding: 8px 10px; border-radius: 4px; cursor: pointer; color: var(--text-muted); margin-bottom: 2px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .nav-btn:hover { background: rgba(255,255,255,0.05); color: white; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h2 style="text-align:center; margin-bottom:20px;">Guilded</h2>
        <input type="email" id="auth-email" class="input-box" placeholder="Email">
        <input type="text" id="auth-nick" class="input-box" placeholder="Username (New users only)">
        <input type="password" id="auth-pass" class="input-box" placeholder="Password">
        <div class="remember-wrap">
            <input type="checkbox" id="auth-remember">
            <label for="auth-remember">Remember Me</label>
        </div>
        <button class="btn-primary" onclick="app.authenticate()">Login / Register</button>
    </div>
</div>

<nav id="nav-rail">
    <div class="guild-icon active" onclick="app.viewDMs()">G</div>
    <div style="width:32px; height:2px; background:#333; margin:4px 0;"></div>
    <div id="guild-list"></div>
    <div class="guild-icon" style="color:var(--success)" onclick="app.createServer()">+</div>
</nav>

<aside id="sidebar">
    <div class="side-header">
        <span id="sidebar-title">Guilded</span>
    </div>

    <div id="voice-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="color:var(--voice); font-size:12px; font-weight:bold;">Voice Connected</span>
            <button onclick="app.leaveVoice()" style="background:none; border:none; color:var(--danger); cursor:pointer;">Disconnect</button>
        </div>
        <div id="voice-users-list"></div>
    </div>

    <div style="flex:1; overflow-y:auto; padding:8px;" id="channel-list"></div>
    
    <div style="padding:8px; background:rgba(0,0,0,0.2); display:flex; align-items:center; gap:10px;">
        <div class="avatar" style="width:32px; height:32px;" id="my-avatar">?</div>
        <div style="flex:1; font-size:12px; font-weight:600;" id="my-name">...</div>
        <div style="cursor:pointer" onclick="app.logout()">🚪</div>
    </div>
</aside>

<main id="chat-main">
    <div id="chat-header"># select-channel</div>
    <div id="message-area"></div>
    <div id="input-zone">
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
    </div>
</main>

<aside id="member-sidebar">
    <div class="member-group" id="group-admin-label">Admins</div>
    <div id="member-list-admins"></div>
    <div class="member-group" id="group-user-label">Online</div>
    <div id="member-list-users"></div>
</aside>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
        authDomain: "hyperspace-r.firebaseapp.com",
        databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hyperspace-r",
        storageBucket: "hyperspace-r.firebasestorage.app",
        messagingSenderId: "1050495683444",
        appId: "1:1050495683444:web:846c42d274197b20313a21"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const app = {
        me: null,
        activeServer: null,
        activePath: null,
        currentVoiceId: null,
        localStream: null,

        async authenticate() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const nick = document.getElementById('auth-nick').value;
            const remember = document.getElementById('auth-remember').checked;
            const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
            
            try {
                await auth.setPersistence(persistence);
                try {
                    await auth.signInWithEmailAndPassword(email, pass);
                } catch (e) {
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.ref(`users/${res.user.uid}`).set({
                        uid: res.user.uid,
                        name: nick || email.split('@')[0],
                        email: email.toLowerCase()
                    });
                }
            } catch(e) { alert(e.message); }
        },

        init() {
            auth.onAuthStateChanged(u => {
                if(u) {
                    db.ref(`users/${u.uid}`).on('value', snap => {
                        this.me = snap.val();
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('my-name').innerText = this.me.name;
                        document.getElementById('my-avatar').innerText = this.me.name[0];
                        this.loadGuilds();
                        this.loadMemberList();
                    });
                }
            });
        },

        async joinVoice(channelId) {
            try {
                this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.currentVoiceId = channelId;
                
                // Signaling our presence in voice
                const voiceRef = db.ref(`voice/${channelId}/${this.me.uid}`);
                voiceRef.set({ name: this.me.name, email: this.me.email });
                voiceRef.onDisconnect().remove();

                document.getElementById('voice-panel').style.display = 'block';
                this.listenForVoiceUsers(channelId);
            } catch (e) {
                alert("Microphone access is required for calls.");
            }
        },

        leaveVoice() {
            if(this.currentVoiceId) {
                db.ref(`voice/${this.currentVoiceId}/${this.me.uid}`).remove();
                if(this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                }
                document.getElementById('voice-panel').style.display = 'none';
                this.currentVoiceId = null;
            }
        },

        listenForVoiceUsers(channelId) {
            db.ref(`voice/${channelId}`).on('value', snap => {
                const list = document.getElementById('voice-users-list');
                list.innerHTML = '';
                snap.forEach(u => {
                    const user = u.val();
                    const div = document.createElement('div');
                    div.className = 'voice-user';
                    div.innerHTML = `<div class="voice-active-indicator"></div> <span>${user.name}</span>`;
                    list.appendChild(div);
                });
            });
        },

        loadGuilds() {
            db.ref('servers').on('value', snap => {
                const rail = document.getElementById('guild-list');
                rail.innerHTML = '';
                snap.forEach(s => {
                    const icon = document.createElement('div');
                    icon.className = 'guild-icon';
                    icon.innerText = s.val().name[0];
                    icon.onclick = () => this.viewServer(s.key, s.val());
                    rail.appendChild(icon);
                });
            });
        },

        viewServer(id, data) {
            this.activeServer = { id, ...data };
            document.getElementById('sidebar-title').innerText = data.name;
            const list = document.getElementById('channel-list');
            list.innerHTML = `
                <div class="member-group" style="padding-left:10px;">Text Channels</div>
                <div class="nav-btn" onclick="app.openChat('servers/${id}/gen', 'general')"># general</div>
                <div class="member-group" style="padding-left:10px; margin-top:15px;">Voice Channels</div>
                <div class="nav-btn" onclick="app.joinVoice('${id}_voice')">🔊 Lounge</div>
            `;
        },

        openChat(path, name) {
            this.activePath = path;
            document.getElementById('chat-header').innerText = `# ${name}`;
            const area = document.getElementById('message-area');
            area.innerHTML = '';
            db.ref(`${path}/messages`).off();
            db.ref(`${path}/messages`).limitToLast(50).on('child_added', snap => {
                const m = snap.val();
                const isOwner = m.email === "rileysargent2@gmail.com";
                const row = document.createElement('div');
                row.className = 'msg-row';
                row.innerHTML = `
                    <div class="avatar" style="background:${isOwner ? 'var(--gold)' : '#444'}; color:${isOwner ? 'black' : 'white'}">${m.name[0]}</div>
                    <div class="msg-info">
                        <div class="msg-user">
                            <span style="color:${isOwner ? 'var(--gold)' : 'inherit'}">${m.name}</span>
                            ${isOwner ? '<span class="badge badge-owner">Owner</span>' : ''}
                        </div>
                        <div class="msg-text">${m.text}</div>
                    </div>
                `;
                area.appendChild(row);
                area.scrollTop = area.scrollHeight;
            });
        },

        send() {
            const input = document.getElementById('msg-input');
            if(!input.value.trim() || !this.activePath) return;
            db.ref(`${this.activePath}/messages`).push({
                uid: this.me.uid, name: this.me.name, email: this.me.email,
                text: input.value, time: Date.now()
            });
            input.value = '';
        },

        loadMemberList() {
            db.ref('users').on('value', snap => {
                const admins = document.getElementById('member-list-admins');
                const users = document.getElementById('member-list-users');
                admins.innerHTML = ''; users.innerHTML = '';
                snap.forEach(u => {
                    const d = u.val();
                    const isOwner = d.email === "rileysargent2@gmail.com";
                    const item = `<div class="member-item"><div class="avatar" style="width:24px; height:24px; font-size:10px; background:${isOwner ? 'var(--gold)' : '#444'}">${d.name[0]}</div> ${d.name}</div>`;
                    if(isOwner) admins.innerHTML += item; else users.innerHTML += item;
                });
            });
        },

        logout() { auth.signOut(); location.reload(); }
    };

    app.init();
    document.getElementById('msg-input').onkeypress = e => { if(e.key === 'Enter') app.send(); };
</script>
</body>
</html>
