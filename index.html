<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilded | Absolute Final working Build</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-deep: #0e1113;
            --bg-side: #1e2327;
            --bg-chat: #313338;
            --bg-members: #2b2d31;
            --accent: #5865f2;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --gold: #f1c40f;
            --danger: #fa777c;
            --success: #23a559;
            --voice: #43b581;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Segoe UI', sans-serif; }
        body { background: var(--bg-deep); height: 100vh; display: flex; color: var(--text-main); overflow: hidden; }

        /* AUTH GATE */
        #auth-screen { position: fixed; inset: 0; background: #111214; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: #2b2d31; padding: 32px; border-radius: 8px; width: 440px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        .auth-card h2 { text-align: center; margin-bottom: 8px; }
        .auth-card p { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        .label { color: var(--text-muted); font-size: 11px; font-weight: 800; margin-bottom: 8px; display: block; text-transform: uppercase; }
        .input-box { width: 100%; padding: 12px; background: #1e1f22; border: none; color: white; border-radius: 4px; margin-bottom: 15px; outline: none; }
        .btn-primary { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .auth-footer { margin-top: 15px; text-align: center; font-size: 14px; color: var(--text-muted); }
        .auth-link { color: var(--accent); cursor: pointer; font-weight: 500; }

        /* APP RAIL */
        #nav-rail { width: 72px; background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; flex-shrink: 0; border-right: 1px solid rgba(0,0,0,0.2); }
        .guild-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-side); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; position: relative; }
        .guild-icon:hover, .guild-icon.active { border-radius: 15px; background: var(--accent); }
        .guild-icon.active::before { content: ""; position: absolute; left: -12px; height: 40px; width: 4px; background: white; border-radius: 4px; }

        /* SIDEBAR */
        #sidebar { width: 240px; background: var(--bg-side); display: flex; flex-direction: column; flex-shrink: 0; }
        .side-header { height: 48px; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.2); font-weight: 700; }
        .side-content { flex: 1; overflow-y: auto; padding: 8px 0; }
        .side-footer { padding: 10px; background: rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; }

        /* CHAT */
        #chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); border-right: 1px solid rgba(255,255,255,0.05); }
        #chat-header { height: 48px; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.2); font-weight: 600; }
        #message-area { flex: 1; overflow-y: auto; padding: 16px; }
        #input-zone { padding: 0 16px 24px; }
        #msg-input { width: 100%; padding: 11px; background: #383a40; border: none; border-radius: 8px; color: white; outline: none; }

        /* MEMBERS */
        #member-sidebar { width: 240px; background: var(--bg-members); display: flex; flex-direction: column; padding: 10px; flex-shrink: 0; }
        .member-group { font-size: 11px; font-weight: 800; color: var(--text-muted); padding: 12px 8px 4px; text-transform: uppercase; }
        .member-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; }

        /* HELPERS */
        .msg-row { display: flex; gap: 16px; margin-bottom: 18px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #444; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .badge { font-size: 9px; padding: 2px 4px; border-radius: 3px; color: white; text-transform: uppercase; margin-left: 5px; }
        .badge-owner { background: var(--gold); color: black; font-weight: 800; }
        .badge-system { background: #5c6fb1; }
        
        .channel-btn { padding: 8px 10px; margin: 2px 8px; border-radius: 4px; cursor: pointer; color: var(--text-muted); font-size: 14px; }
        .channel-btn:hover, .channel-btn.active { background: rgba(255,255,255,0.05); color: white; }
        
        #voice-active-box { background: #232428; padding: 10px; margin: 8px; border-radius: 8px; border: 1px solid var(--voice); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card" id="card-login">
        <h2>Welcome back!</h2>
        <p>Log in to your account</p>
        <span class="label">Email</span>
        <input type="email" id="l-email" class="input-box">
        <span class="label">Password</span>
        <input type="password" id="l-pass" class="input-box">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px; font-size:14px; color:var(--text-muted);">
            <input type="checkbox" id="l-rem"> <label for="l-rem">Remember Me</label>
        </div>
        <button class="btn-primary" style="width:100%" onclick="app.authAction('login')">Log In</button>
        <div class="auth-footer">Don't have an account? <span class="auth-link" onclick="app.setAuthView('reg')">Register</span></div>
    </div>

    <div class="auth-card hidden" id="card-reg">
        <h2>Create account</h2>
        <p>Join Guilded today</p>
        <span class="label">Email</span>
        <input type="email" id="r-email" class="input-box">
        <span class="label">Username</span>
        <input type="text" id="r-nick" class="input-box">
        <span class="label">Password</span>
        <input type="password" id="r-pass" class="input-box">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px; font-size:14px; color:var(--text-muted);">
            <input type="checkbox" id="r-rem"> <label for="r-rem">Remember Me</label>
        </div>
        <button class="btn-primary" style="width:100%" onclick="app.authAction('reg')">Register</button>
        <div class="auth-footer"><span class="auth-link" onclick="app.setAuthView('login')">Already have an account?</span></div>
    </div>
</div>

<nav id="nav-rail">
    <div class="guild-icon active" id="rail-dm" onclick="app.viewDMs()">G</div>
    <div style="width:32px; height:2px; background:#333; margin:4px 0;"></div>
    <div id="guild-render-area" style="display:contents;"></div>
    <div class="guild-icon" style="color:var(--success)" onclick="app.promptCreateServer()">+</div>
</nav>

<aside id="sidebar">
    <div class="side-header" id="sidebar-title">Guilded</div>
    <div id="voice-active-box" class="hidden">
        <div style="color:var(--voice); font-size:11px; font-weight:bold; margin-bottom:5px;">🔊 VOICE CHANNEL</div>
        <button onclick="app.disconnectVoice()" style="background:var(--danger); color:white; border:none; padding:4px; border-radius:3px; cursor:pointer; width:100%; font-size:10px;">Disconnect</button>
    </div>
    <div class="side-content" id="sidebar-list"></div>
    <div class="side-footer">
        <div class="avatar" style="width:32px; height:32px; font-size:12px;" id="u-avatar">?</div>
        <div style="flex:1; font-size:13px; font-weight:600;" id="u-name">...</div>
        <div style="cursor:pointer; opacity:0.5;" onclick="app.signOut()">🚪</div>
    </div>
</aside>

<main id="chat-main">
    <div id="chat-header"># welcome</div>
    <div id="message-area"></div>
    <div id="input-zone">
        <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
    </div>
</main>

<aside id="member-sidebar">
    <div class="member-group">Admins</div>
    <div id="list-admins"></div>
    <div class="member-group">Online</div>
    <div id="list-users"></div>
</aside>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCr2mG-lVDHFwW4fTAx7_5AwZX2jJ8myrw",
        authDomain: "hyperspace-r.firebaseapp.com",
        databaseURL: "https://hyperspace-r-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hyperspace-r",
        storageBucket: "hyperspace-r.firebasestorage.app",
        messagingSenderId: "1050495683444",
        appId: "1:1050495683444:web:846c42d274197b20313a21"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const ADMINS = ["rileysargent2@gmail.com", "guildedsec@gmail.com"];

    const app = {
        me: null,
        activePath: null,
        micStream: null,

        setAuthView(v) {
            document.getElementById('card-login').classList.toggle('hidden', v !== 'login');
            document.getElementById('card-reg').classList.toggle('hidden', v !== 'reg');
        },

        async authAction(type) {
            const email = document.getElementById(type === 'login' ? 'l-email' : 'r-email').value;
            const pass = document.getElementById(type === 'login' ? 'l-pass' : 'r-pass').value;
            const rem = document.getElementById(type === 'login' ? 'l-rem' : 'r-rem').checked;
            
            try {
                await auth.setPersistence(rem ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
                if(type === 'login') {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    const nick = document.getElementById('r-nick').value;
                    if(!nick) return alert("Username required");
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.ref(`users/${res.user.uid}`).set({ uid: res.user.uid, name: nick, email: email.toLowerCase() });
                }
            } catch(e) { alert(e.message); }
        },

        init() {
            auth.onAuthStateChanged(u => {
                if(u) {
                    db.ref(`users/${u.uid}`).on('value', snap => {
                        this.me = snap.val();
                        if(!this.me) return;
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('u-name').innerText = this.me.name;
                        document.getElementById('u-avatar').innerText = this.me.name[0];
                        this.syncGuilds();
                        this.syncGlobalMembers();
                        this.viewDMs();
                    });
                } else {
                    document.getElementById('auth-screen').style.display = 'flex';
                }
            });
        },

        syncGuilds() {
            db.ref('servers').on('value', snap => {
                const area = document.getElementById('guild-render-area');
                area.innerHTML = '';
                snap.forEach(s => {
                    const icon = document.createElement('div');
                    icon.className = 'guild-icon';
                    icon.innerText = s.val().name[0];
                    icon.onclick = () => this.viewServer(s.key, s.val());
                    area.appendChild(icon);
                });
            });
        },

        syncGlobalMembers() {
            db.ref('users').on('value', snap => {
                const adm = document.getElementById('list-admins');
                const usr = document.getElementById('list-users');
                adm.innerHTML = ''; usr.innerHTML = '';
                snap.forEach(u => {
                    const d = u.val();
                    const isAdmin = ADMINS.includes(d.email.toLowerCase());
                    const item = `<div class="member-item">
                        <div class="avatar" style="width:28px; height:28px; font-size:11px; background:${isAdmin ? 'var(--gold)' : '#444'}; color:${isAdmin ? 'black' : 'white'}">${d.name[0]}</div>
                        <span style="font-size:14px; color:${isAdmin ? 'var(--gold)' : 'inherit'}">${d.name}</span>
                    </div>`;
                    if(isAdmin) adm.innerHTML += item; else usr.innerHTML += item;
                });
            });
        },

        viewServer(id, data) {
            document.getElementById('sidebar-title').innerText = data.name;
            const list = document.getElementById('sidebar-list');
            list.innerHTML = `
                <div class="member-group">Text Channels</div>
                <div class="channel-btn" onclick="app.openChat('servers/${id}/gen', 'general')"># general</div>
                <div class="member-group" style="margin-top:12px;">Voice Channels</div>
                <div class="channel-btn" onclick="app.connectVoice('${id}_voice')">🔊 Lounge</div>
            `;
        },

        viewDMs() {
            document.getElementById('sidebar-title').innerText = "Direct Messages";
            const list = document.getElementById('sidebar-list');
            list.innerHTML = '';
            db.ref('users').once('value', snap => {
                snap.forEach(u => {
                    if(u.key === this.me.uid) return;
                    const d = u.val();
                    const btn = document.createElement('div');
                    btn.className = 'channel-btn';
                    btn.innerHTML = `<span>@</span> ${d.name}`;
                    btn.onclick = () => {
                        const room = this.me.uid < u.key ? `${this.me.uid}_${u.key}` : `${u.key}_${this.me.uid}`;
                        this.openChat(`dms/${room}`, d.name);
                    };
                    list.appendChild(btn);
                });
            });
        },

        openChat(path, name) {
            this.activePath = path;
            document.getElementById('chat-header').innerText = `# ${name}`;
            const area = document.getElementById('message-area');
            area.innerHTML = '';
            db.ref(`${path}/messages`).off();
            db.ref(`${path}/messages`).limitToLast(60).on('child_added', snap => {
                const m = snap.val();
                const isA = ADMINS.includes(m.email.toLowerCase());
                const isS = m.isSystem;
                const row = document.createElement('div');
                row.className = 'msg-row';
                row.innerHTML = `
                    <div class="avatar" style="background:${isS ? 'var(--accent)' : (isA ? 'var(--gold)' : '#444')}; color:${isA && !isS ? 'black' : 'white'}">${isS ? 'G' : m.name[0]}</div>
                    <div class="msg-info">
                        <div style="font-weight:600; color:${isA && !isS ? 'var(--gold)' : 'inherit'}">
                            ${isS ? 'Guilded' : m.name} ${isA && !isS ? '<span class="badge badge-owner">Owner</span>' : ''} ${isS ? '<span class="badge badge-system">System</span>' : ''}
                        </div>
                        <div style="line-height:1.4;">${m.text}</div>
                    </div>`;
                area.appendChild(row);
                area.scrollTop = area.scrollHeight;
            });
        },

        async connectVoice(id) {
            try {
                this.micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('voice-active-box').classList.remove('hidden');
            } catch(e) { alert("Mic required for calls."); }
        },

        disconnectVoice() {
            if(this.micStream) this.micStream.getTracks().forEach(t => t.stop());
            document.getElementById('voice-active-box').classList.add('hidden');
        },

        send() {
            const inp = document.getElementById('msg-input');
            let val = inp.value.trim();
            if(!val || !this.activePath) return;

            let pkg = { uid: this.me.uid, name: this.me.name, email: this.me.email, text: val, time: Date.now(), isSystem: false };
            const isA = ADMINS.includes(this.me.email.toLowerCase());
            if(isA && val.startsWith("/sys ")) { pkg.text = val.replace("/sys ", ""); pkg.isSystem = true; }

            db.ref(`${this.activePath}/messages`).push(pkg);
            inp.value = '';
        },

        promptCreateServer() {
            const n = prompt("Server Name:");
            if(n) db.ref('servers').push({ name: n, owner: this.me.uid });
        },

        signOut() { auth.signOut().then(() => location.reload()); }
    };

    app.init();
    document.getElementById('msg-input').onkeypress = e => { if(e.key === 'Enter') app.send(); };
</script>
</body>
</html>
