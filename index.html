<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Studio | Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24;
            --border: rgba(255, 255, 255, 0.07); --accent: #6c63ff;
            --text: #f0f0ff; --muted: #6b6b8a; --success: #4ade80;
            --font: 'Syne', sans-serif; --mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }

        /* --- UI STATES --- */
        .ui-screen { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 100; }
        .active-screen { display: flex; }

        /* --- MAIN MENU --- */
        #screen-menu { background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0f 100%); align-items: center; justify-content: center; }
        .menu-card { text-align: center; animation: fadeIn 0.8s ease; }
        .logo-large { font-size: 64px; font-weight: 800; margin-bottom: 10px; }
        .logo-large span { color: var(--accent); text-shadow: 0 0 20px rgba(108,99,255,0.5); }
        .menu-btns { display: flex; gap: 15px; margin-top: 30px; }

        /* --- STUDIO UI --- */
        #screen-studio { flex-direction: row; }
        .studio-nav { height: 42px; position: fixed; top: 0; left: 0; right: 0; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; z-index: 200; }
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); margin-top: 42px; display: flex; flex-direction: column; }
        .prop-sidebar { width: 280px; border-right: none; border-left: 1px solid var(--border); }
        .viewport { flex: 1; margin-top: 42px; background: #000; position: relative; }
        .panel-h { padding: 10px; font-size: 11px; font-weight: 800; color: var(--muted); border-bottom: 1px solid var(--border); letter-spacing: 1px; }
        .tree-item { padding: 6px 12px; font-family: var(--mono); font-size: 12px; cursor: pointer; transition: 0.2s; }
        .tree-item:hover { background: var(--surface2); }
        .tree-item.selected { background: var(--accent); color: white; }

        /* --- BUTTONS --- */
        .btn { padding: 12px 28px; border-radius: 8px; border: none; font-family: var(--font); font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }

        /* --- HUD --- */
        #play-hud { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; pointer-events: none; }
        #xhair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 10px; height: 10px; border: 2px solid white; border-radius: 50%; display: none; pointer-events: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="screen-menu" class="ui-screen active-screen">
        <div class="menu-card">
            <div class="logo-large">Hyper<span>space</span></div>
            <p style="color:var(--muted)">v2.0.4 — Build Logic Engine</p>
            <div class="menu-btns">
                <button class="btn btn-primary" onclick="switchState('studio')">Open Studio</button>
                <button class="btn btn-ghost" onclick="switchState('play')">Quick Play</button>
            </div>
        </div>
    </div>

    <div id="screen-studio" class="ui-screen">
        <nav class="studio-nav">
            <div style="font-weight:800; font-size:14px; margin-right:20px;">⬡ Studio</div>
            <button class="btn-ghost" style="padding:5px 12px; font-size:12px;" onclick="switchState('play')">▶ Run</button>
            <div style="flex:1"></div>
            <button class="btn-ghost" style="padding:5px 12px; font-size:12px; color:var(--error)" onclick="switchState('menu')">Exit</button>
        </nav>
        
        <aside class="sidebar">
            <div class="panel-h">EXPLORER</div>
            <div id="explorer-tree"></div>
        </aside>

        <main class="viewport" id="studio-viewport"></main>

        <aside class="sidebar prop-sidebar">
            <div class="panel-h">PROPERTIES</div>
            <div id="properties-content" style="padding:15px; font-size:12px; color:var(--muted)">Select an instance...</div>
            <div style="margin-top:auto; padding:15px; border-top:1px solid var(--border)">
                <button class="btn btn-primary" style="width:100%; font-size:12px;" onclick="document.getElementById('file-upload').click()">Upload Model</button>
                <input type="file" id="file-upload" hidden onchange="handleUpload(this)">
            </div>
        </aside>
    </div>

    <canvas id="mainCanvas" style="position:fixed; inset:0; z-index:1;"></canvas>
    <div id="xhair"></div>
    <div id="play-hud">
        <div style="background:rgba(0,0,0,0.8); padding:10px 20px; border-radius:10px; border:1px solid var(--accent)">
            Press <strong>ESC</strong> to return to Studio
        </div>
    </div>

    <script type="module">
        // --- CONSTANTS & SETUP ---
        const canvas = document.getElementById('mainCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(5, 10, 7);
        scene.add(ambient, sun);

        // Floor Grid
        const grid = new THREE.GridHelper(100, 50, 0x6c63ff, 0x222222);
        scene.add(grid);

        // --- INSTANCE SYSTEM ---
        let instances = [];
        let selectedId = null;

        function createPart(name = "Part", pos = {x:0, y:0.5, z:0}) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0x6c63ff });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(pos.x, pos.y, pos.z);
            scene.add(mesh);

            const inst = { id: Math.random().toString(36).substr(2,9), name, type: "Part", mesh };
            instances.push(inst);
            updateExplorer();
            return inst;
        }

        function updateExplorer() {
            const tree = document.getElementById('explorer-tree');
            tree.innerHTML = '';
            instances.forEach(inst => {
                const div = document.createElement('div');
                div.className = `tree-item ${selectedId === inst.id ? 'selected' : ''}`;
                div.innerHTML = `📦 ${inst.name}`;
                div.onclick = () => selectInstance(inst.id);
                tree.appendChild(div);
            });
        }

        function selectInstance(id) {
            selectedId = id;
            const inst = instances.find(i => i.id === id);
            updateExplorer();
            const props = document.getElementById('properties-content');
            props.innerHTML = `
                <div style="margin-bottom:10px"><strong>Data</strong></div>
                Name: <input type="text" value="${inst.name}" style="background:#000; color:#fff; border:1px solid #333; padding:2px;"><br><br>
                Type: ${inst.type}<br>
                ID: ${inst.id}<br><br>
                <div style="margin-bottom:10px"><strong>Transform</strong></div>
                Pos: ${inst.mesh.position.x}, ${inst.mesh.position.y}, ${inst.mesh.position.z}
            `;
        }

        // --- STATE MANAGER ---
        let currentState = 'menu';
        window.switchState = function(state) {
            currentState = state;
            document.querySelectorAll('.ui-screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('play-hud').style.display = 'none';
            document.getElementById('xhair').style.display = 'none';

            if(state === 'menu') {
                document.getElementById('screen-menu').classList.add('active-screen');
                camera.position.set(5, 5, 5);
                camera.lookAt(0, 0, 0);
            } 
            else if(state === 'studio') {
                document.getElementById('screen-studio').classList.add('active-screen');
                camera.position.set(8, 8, 8);
                camera.lookAt(0, 0, 0);
            } 
            else if(state === 'play') {
                document.getElementById('play-hud').style.display = 'flex';
                document.getElementById('xhair').style.display = 'block';
                canvas.requestPointerLock();
            }
        };

        // --- FILE UPLOADER ---
        window.handleUpload = (input) => {
            const file = input.files[0];
            if(file) {
                // Logic for GLTFLoader would go here
                alert("Uploading: " + file.name + "\n(Integration with GLTFLoader active)");
                createPart(file.name.split('.')[0]);
            }
        };

        // --- CORE LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Subtle rotation in Menu
            if(currentState === 'menu') {
                scene.rotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        // Initial setup
        createPart("Baseplate", {x:0, y:-0.5, z:0});
        instances[0].mesh.scale.set(100, 1, 100);
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        animate();

        // Escape Key to exit play mode
        document.addEventListener('pointerlockchange', () => {
            if (!document.pointerLockElement && currentState === 'play') {
                switchState('studio');
            }
        });

    </script>
</body>
</html>
