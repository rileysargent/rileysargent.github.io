<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperspace | Home & Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #0b0b0e; --panel: #16161c; --border: rgba(255,255,255,0.06);
            --accent: #ffffff; --text: #ffffff; --muted: #8e8e93;
            --font: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; height: 100vh; }

        /* --- HOME UI (IMAGE STYLE) --- */
        #layer-home { display: none; flex-direction: column; padding: 40px 60px; overflow-y: auto; height: 100%; pointer-events: all; }
        .home-nav { display: flex; gap: 30px; align-items: center; margin-bottom: 40px; }
        .nav-pill { padding: 8px 20px; border-radius: 20px; background: rgba(255,255,255,0.1); font-weight: 600; cursor: pointer; }
        .nav-pill.active { background: #fff; color: #000; }
        
        .section-label { font-size: 18px; font-weight: 700; margin: 20px 0; }
        .h-row { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .h-row::-webkit-scrollbar { height: 4px; }
        .h-row::-webkit-scrollbar-thumb { background: var(--border); }

        .game-card { min-width: 160px; height: 160px; background: var(--panel); border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .game-card:hover { transform: scale(1.05); border-color: var(--accent); }
        .game-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .game-card-label { position: absolute; bottom: 8px; left: 8px; font-size: 12px; font-weight: 600; }

        .friend-circle { min-width: 70px; height: 70px; border-radius: 50%; background: var(--panel); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; }

        /* --- STUDIO UI --- */
        #layer-studio { display: none; height: 100%; flex-direction: row; }
        .studio-sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; pointer-events: all; }
        .vp-container { flex: 1; position: relative; pointer-events: all; }
        .toolbar { height: 45px; background: #111; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; gap: 10px; }

        /* --- STATE OVERLAYS --- */
        .layer.active { display: flex; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="layer-home" class="layer active">
        <div class="home-nav">
            <div class="nav-pill active">🏠 Home</div>
            <div class="nav-pill">👤 Avatar</div>
            <div class="nav-pill">💬 Connect</div>
        </div>

        <div class="section-label">Friends (18)</div>
        <div class="h-row">
            <div class="friend-circle" onclick="alert('Viewing Friend Profile')">🙂</div>
            <div class="friend-circle">😎</div>
            <div class="friend-circle">🤖</div>
            <div class="friend-circle">🐱</div>
            <div class="friend-circle">🦊</div>
        </div>

        <div class="section-label">Continue</div>
        <div class="h-row">
            <div class="game-card" onclick="setState('play')">
                <div class="game-card-label">The Hyperspace Proj...</div>
            </div>
            <div class="game-card" onclick="setState('studio')">
                <div class="game-card-label" style="color: var(--accent)">Edit in Studio</div>
            </div>
            <div class="game-card"></div>
            <div class="game-card"></div>
        </div>
    </div>

    <div id="layer-studio" class="layer">
        <aside class="studio-sidebar">
            <div style="padding:15px; font-size:11px; font-weight:800; border-bottom:1px solid var(--border);">EXPLORER</div>
            <div id="explorer-list" style="padding:10px; font-size:12px;"></div>
        </aside>
        
        <main class="vp-container">
            <div class="toolbar">
                <button onclick="setState('play')" style="padding:4px 12px; background:#fff; color:#000; border:none; border-radius:4px; font-weight:800; font-size:11px; cursor:pointer;">PLAY</button>
                <button onclick="setState('home')" style="background:none; color:#fff; border:1px solid #444; border-radius:4px; font-size:11px; padding:3px 10px; cursor:pointer;">HOME</button>
            </div>
            <div id="viewport" style="width:100%; height:calc(100% - 45px);"></div>
        </main>

        <aside class="studio-sidebar" style="border-right:none; border-left:1px solid var(--border); width:300px;">
            <div style="padding:15px; font-size:11px; font-weight:800; border-bottom:1px solid var(--border);">PROPERTIES</div>
            <div id="prop-box" style="padding:20px; color:var(--muted); font-size:12px;">No Selection</div>
        </aside>
    </div>

    <script>
        // --- 3D ENGINE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // Data
        let instances = [];
        let selected = null;
        let isRightMouseDown = false;
        let state = 'home';
        let camPhi = Math.PI/4, camTheta = Math.PI/4, camDist = 20;

        function createPart(name, pos, size, col=0x6c63ff) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(size.x,size.y,size.z), new THREE.MeshStandardMaterial({color:col}));
            mesh.position.set(pos.x, pos.y, pos.z);
            scene.add(mesh);
            instances.push({name, mesh});
            updateExplorer();
        }

        // --- CONTROLS ---
        window.addEventListener('mousedown', (e) => {
            if (e.button === 2) isRightMouseDown = true; // Right click
            
            // Selection Logic
            if (state === 'studio' && e.button === 0) {
                const mouse = new THREE.Vector2(
                    (e.clientX / window.innerWidth) * 2 - 1,
                    -(e.clientY / window.innerHeight) * 2 + 1
                );
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(instances.map(i => i.mesh));
                
                if (hits.length > 0) {
                    selected = instances.find(i => i.mesh === hits[0].object);
                    document.getElementById('prop-box').innerHTML = `<b>Name:</b> ${selected.name}<br><b>Type:</b> Part`;
                } else {
                    selected = null;
                    document.getElementById('prop-box').innerText = "No Selection";
                }
            }
        });

        window.addEventListener('mouseup', (e) => { if(e.button === 2) isRightMouseDown = false; });
        window.oncontextmenu = (e) => e.preventDefault(); // Disable context menu

        window.addEventListener('mousemove', (e) => {
            if (isRightMouseDown && state === 'studio') {
                camTheta -= e.movementX * 0.005;
                camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi - e.movementY * 0.005));
            }
        });

        window.addEventListener('wheel', (e) => {
            camDist = Math.max(5, Math.min(100, camDist + e.deltaY * 0.05));
        });

        // --- STATE MANAGER ---
        window.setState = (s) => {
            state = s;
            document.querySelectorAll('.layer').forEach(l => l.classList.remove('active'));
            if (s === 'home') document.getElementById('layer-home').classList.add('active');
            if (s === 'studio') {
                document.getElementById('layer-studio').classList.add('active');
                document.getElementById('viewport').appendChild(renderer.domElement);
                updateLayout();
            }
            if (s === 'play') {
                document.body.appendChild(renderer.domElement);
                renderer.domElement.requestPointerLock();
            }
        };

        function updateExplorer() {
            document.getElementById('explorer-list').innerHTML = instances.map(i => `<div>📦 ${i.name}</div>`).join('');
        }

        function updateLayout() {
            const vp = document.getElementById('viewport');
            renderer.setSize(vp.clientWidth, vp.clientHeight);
            camera.aspect = vp.clientWidth / vp.clientHeight;
            camera.updateProjectionMatrix();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Orbit Camera Math
            camera.position.x = camDist * Math.sin(camPhi) * Math.cos(camTheta);
            camera.position.y = camDist * Math.cos(camPhi);
            camera.position.z = camDist * Math.sin(camPhi) * Math.sin(camTheta);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        createPart("Baseplate", {x:0, y:-0.5, z:0}, {x:50, y:1, z:50}, 0x16161d);
        createPart("Spawn", {x:0, y:0.5, z:0}, {x:4, y:1, z:4});
        
        animate();
        window.addEventListener('resize', updateLayout);
    </script>
</body>
</html>
