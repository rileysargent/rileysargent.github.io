<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperspace Studio | Engine v2.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24;
            --border: rgba(255, 255, 255, 0.07); --accent: #6c63ff;
            --text: #f0f0ff; --muted: #6b6b8a; --success: #4ade80; --error: #f87171;
            --font: 'Syne', sans-serif; --mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body, html { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }

        /* --- UI OVERLAYS --- */
        .ui-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: none; }
        .ui-layer.active { display: flex; }
        .pointer { pointer-events: all; }

        /* --- STUDIO LAYOUT --- */
        #studio-shell { flex-direction: row; height: 100%; }
        .studio-nav { height: 42px; width: 100%; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; position: absolute; top: 0; }
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); margin-top: 42px; display: flex; flex-direction: column; pointer-events: all; }
        .viewport { flex: 1; margin-top: 42px; position: relative; pointer-events: all; }
        
        /* --- PAUSE MENU --- */
        #pause-menu { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); align-items: center; justify-content: center; flex-direction: column; gap: 15px; }

        /* --- BUTTONS --- */
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-family: var(--font); font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: rgba(248,113,113,0.1); border: 1px solid var(--error); color: var(--error); }
        .btn:hover { transform: scale(1.05); }

        /* --- HUD --- */
        #xhair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 4px; height: 4px; background: white; border-radius: 50%; display: none; }
        
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="layer-menu" class="ui-layer active pointer" style="background: radial-gradient(circle at center, #161625 0%, #0a0a0f 100%); align-items:center; justify-content:center; flex-direction:column;">
        <h1 style="font-size: 3rem; margin-bottom: 20px;">Hyper<span>space</span></h1>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="setState('studio')">Open Studio</button>
            <button class="btn btn-primary" onclick="setState('play')">Quick Play</button>
        </div>
    </div>

    <div id="layer-studio" class="ui-layer">
        <div id="studio-shell" style="display:flex; width:100%;">
            <nav class="studio-nav">
                <span style="font-weight:800; font-size:12px; opacity:0.6; margin-right:20px;">STUDIO v2.5</span>
                <button class="btn-primary" style="padding:4px 12px; font-size:11px;" onclick="setState('play')">PLAY</button>
            </nav>
            <aside class="sidebar">
                <div style="padding:10px; font-size:10px; font-weight:800; border-bottom:1px solid var(--border);">EXPLORER</div>
                <div id="explorer-list" style="flex:1; padding:10px;"></div>
            </aside>
            <main class="viewport" id="v-port"></main>
            <aside class="sidebar" style="border-left:1px solid var(--border); border-right:none; width:280px;">
                <div style="padding:10px; font-size:10px; font-weight:800; border-bottom:1px solid var(--border);">PROPERTIES</div>
                <div id="prop-list" style="padding:15px; font-size:12px; color:var(--muted);">Select a part to edit...</div>
            </aside>
        </div>
    </div>

    <div id="layer-pause" class="ui-layer pointer">
        <div id="pause-menu" style="display:flex; width:100%; height:100%;">
            <h2 style="font-size:2rem; margin-bottom:10px;">Paused</h2>
            <button class="btn btn-primary" onclick="resumePlay()">Resume</button>
            <button class="btn btn-danger" onclick="setState('studio')">Back to Studio</button>
        </div>
    </div>

    <div id="xhair"></div>

    <script type="module">
        // --- GLOBALS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const orbit = new THREE.OrbitControls(camera, renderer.domElement);
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // --- GAME ENGINE LOGIC ---
        let state = 'menu';
        let instances = [];
        let selected = null;
        let player = { x: 0, y: 1, z: 10, vy: 0, yaw: 0, zoom: 5 };

        function createPart(name, pos, size, color = 0x6c63ff) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(size.x, size.y, size.z),
                new THREE.MeshStandardMaterial({ color })
            );
            mesh.position.set(pos.x, pos.y, pos.z);
            scene.add(mesh);
            const inst = { id: Math.random(), name, mesh };
            instances.push(inst);
            updateExplorer();
            return inst;
        }

        // --- INPUTS ---
        window.addEventListener('mousedown', (e) => {
            if (state !== 'studio') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(instances.map(i => i.mesh));
            
            if (intersects.length > 0) {
                selected = instances.find(i => i.mesh === intersects[0].object);
                document.getElementById('prop-list').innerHTML = `<b>Name:</b> ${selected.name}<br><b>Pos:</b> ${selected.mesh.position.x.toFixed(1)}, ${selected.mesh.position.y.toFixed(1)}, ${selected.mesh.position.z.toFixed(1)}`;
            } else {
                selected = null;
                document.getElementById('prop-list').innerText = "Select a part to edit...";
            }
        });

        // --- STATE MANAGER ---
        window.setState = (s) => {
            state = s;
            document.querySelectorAll('.ui-layer').forEach(l => l.classList.remove('active'));
            document.getElementById('xhair').style.display = 'none';
            orbit.enabled = (s === 'studio');

            if (s === 'menu') document.getElementById('layer-menu').classList.add('active');
            if (s === 'studio') {
                document.getElementById('layer-studio').classList.add('active');
                camera.position.set(10, 10, 10);
                camera.lookAt(0,0,0);
            }
            if (s === 'play') {
                document.getElementById('xhair').style.display = 'block';
                renderer.domElement.requestPointerLock();
            }
        };

        window.resumePlay = () => {
            state = 'play';
            document.getElementById('layer-pause').classList.remove('active');
            renderer.domElement.requestPointerLock();
        };

        document.addEventListener('pointerlockchange', () => {
            if (!document.pointerLockElement && state === 'play') {
                state = 'pause';
                document.getElementById('layer-pause').classList.add('active');
            }
        });

        function updateExplorer() {
            const list = document.getElementById('explorer-list');
            list.innerHTML = instances.map(i => `<div style="font-size:11px; padding:2px;">📦 ${i.name}</div>`).join('');
        }

        // --- CORE LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (state === 'play') {
                // Third Person Camera Logic
                const offset = new THREE.Vector3(0, 2, player.zoom);
                offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
                camera.position.set(player.x + offset.x, player.y + offset.y, player.z + offset.z);
                camera.lookAt(player.x, player.y + 1, player.z);

                // Simple Gravity/Collision
                player.vy -= 0.01;
                player.y += player.vy;
                if (player.y < 0.5) { player.y = 0.5; player.vy = 0; }
            }

            renderer.render(scene, camera);
        }

        // Initial setup
        createPart("Baseplate", {x:0, y:-0.5, z:0}, {x:100, y:1, z:100}, 0x111118);
        createPart("SpawnBlock", {x:0, y:0.5, z:0}, {x:4, y:1, z:4}, 0x4ade80);
        
        animate();
    </script>
</body>
</html>
