<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Amazing Digital Circus - CSS Sprite Engine</title>
    <link rel="stylesheet" href="sprites.css">
</head>
<body>

    <div id="game-container">
        <!-- Digital Circus Arena Floor -->
        <div id="arena">
            <div class="spotlight"></div>
            <div id="exit-door">EXIT</div>

            <!-- Character Sprites -->
            <div id="pomni" class="sprite character-sprite pomni-sprite">
                <div class="jester-hat-left"></div>
                <div class="jester-hat-right"></div>
                <div class="head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="mouth"></div>
                </div>
                <div class="body"></div>
            </div>

            <div id="caine" class="sprite character-sprite caine-sprite" data-name="Caine">
                <div class="top-hat"></div>
                <div class="jaw upper-jaw"></div>
                <div class="eyeball">
                    <div class="iris"></div>
                </div>
                <div class="jaw lower-jaw"></div>
            </div>

            <div id="jax" class="sprite character-sprite jax-sprite" data-name="Jax">
                <div class="ear left-ear"></div>
                <div class="ear right-ear"></div>
                <div class="head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="smirk"></div>
                </div>
                <div class="overalls"></div>
            </div>

            <div id="ragatha" class="sprite character-sprite ragatha-sprite" data-name="Ragatha">
                <div class="yarn-hair"></div>
                <div class="head">
                    <div class="eye left"></div>
                    <div class="eye right-button"></div>
                </div>
                <div class="dress"></div>
            </div>

            <div id="kinger" class="sprite character-sprite kinger-sprite" data-name="Kinger">
                <div class="crown"></div>
                <div class="robe"></div>
                <div class="head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
            </div>

            <!-- Gloinks Container -->
            <div id="gloinks-layer"></div>
        </div>

        <!-- Glitch Screen Overlay -->
        <div id="glitch-layer"></div>

        <!-- Speech Bubble -->
        <div id="dialogue-box" class="speech-bubble"></div>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-card">
                <span class="hud-label">Sanity</span>
                <div class="bar-bg"><div id="sanity-fill" class="bar-fill"></div></div>
            </div>
            <div class="hud-card">
                <span class="hud-label">Gloinks:</span>
                <span id="gloink-score" class="score-badge">0</span>
            </div>
        </div>

        <!-- Controls Footer -->
        <div class="controls">
            <div class="keys-info">
                <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Walk
                <span class="key" style="margin-left: 10px;">E</span> Interact
            </div>
            <button class="btn" id="btn-adventure">Trigger Adventure</button>
            <button class="btn btn-blue" id="btn-spawn-gloink">Spawn Gloinks</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
