<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperspace Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #chat-ui { display: none; flex-direction: column; height: 100vh; }
        #chat-window { flex: 1; overflow-y: auto; padding: 10px; }
        input { padding: 10px; margin: 5px; width: 80%; background: #333; border: 1px solid #555; color: white; }
        .msg { padding: 5px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<!-- Login UI -->
<div id="login-overlay">
    <h2>Choose a Username</h2>
    <input type="text" id="username-input" placeholder="Enter username...">
    <button onclick="registerUser()">Join Chat</button>
</div>

<!-- Chat UI -->
<div id="chat-ui">
    <div id="chat-window"></div>
    <div id="input-area">
        <input type="text" id="chat-input" placeholder="Type message...">
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB6d6KXpzXBS702PwR2TYdA2vWiYRP-OJ0",
        authDomain: "hyperspacechat.firebaseapp.com",
        databaseURL: "https://hyperspacechat-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hyperspacechat",
        storageBucket: "hyperspacechat.firebasestorage.app",
        messagingSenderId: "620090648601",
        appId: "1:620090648601:web:06826975596fceb32aa288",
        measurementId: "G-R4FJRSSKHY"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    
    // Initialize Database globally so it's ready for registerUser
    const db = firebase.database();
    let currentUser = "";

    function registerUser() {
        const username = document.getElementById('username-input').value.trim();
        if (!username) return;

        // Use the global 'db' variable
        db.ref('usernames/' + username).transaction((currentData) => {
            if (currentData === null) return true; 
            return; 
        }, (error, committed, snapshot) => {
            if (committed) {
                currentUser = username;
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('chat-ui').style.display = 'flex';
                initChat();
            } else {
                alert("Username is taken!");
            }
        });
    }

    function initChat() {
        const chatRef = db.ref('messages');
        const input = document.getElementById('chat-input');
        const win = document.getElementById('chat-window');

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== "") {
                chatRef.push({ user: currentUser, text: input.value, ts: Date.now() });
                input.value = "";
            }
        });

        chatRef.limitToLast(20).on('child_added', (snap) => {
            const data = snap.val();
            const msg = document.createElement('div');
            msg.className = 'msg';
            msg.innerHTML = `<b>${data.user}:</b> ${data.text}`;
            win.appendChild(msg);
            win.scrollTop = win.scrollHeight;
        });
    }
</script>
</body>
</html>
